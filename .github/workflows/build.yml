name: Ultimate Production Release

on:
  workflow_dispatch:

jobs:
  build_and_sign:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node & Java
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Install Build Tools
        run: |
          npm init -y
          npm install html-minifier-terser esbuild @capacitor/core @capacitor/cli @capacitor/android @capacitor/assets fflate@0.8.2 libarchive.js@1.3.0

      - name: Minify & Heavy Packing (Сборка всех ядер)
        run: |
          mkdir -p public
          
          # 1. Мумифицируем главный файл
          npx html-minifier-terser index.html --minify-js --collapse-whitespace --remove-comments --output public/index.html

          # 2. Сжимаем твои расширения
          if [ -f "arcade-extensions.js" ]; then
            npx esbuild arcade-extensions.js --bundle --minify --format=iife --outfile=public/arcade-extensions.bundle.js
          fi

          # 3. КОПИРУЕМ ЯДРА И РЕСУРСЫ (Всё со скриншота)
          # Забираем WASM, аудио, тексты, картинки и сложные расширения типа .wasm.js
          cp *.wasm *.wasm.js *.txt *.mp3 *.png *.json public/ 2>/dev/null || true
          
          # Копируем ВСЕ JS-файлы (ядра Sega, SNES, GBA, DOS и т.д.)
          # Исключаем только оригинальный arcade-extensions (т.к. мы его сжали выше)
          find . -maxdepth 1 -name "*.js" ! -name "arcade-extensions.js" -exec cp {} public/ \;

          # 4. Копируем библиотеки распаковки из node_modules
          cp node_modules/fflate/umd/index.js public/fflate.js
          cp node_modules/libarchive.js/main.js public/libarchive.js
          cp node_modules/libarchive.js/dist/worker-bundle.js public/worker-bundle.js

      - name: Capacitor Sync
        run: |
          echo '{
            "appId": "com.arcade.hub",
            "appName": "Arcade Hub",
            "webDir": "public",
            "bundledWebRuntime": false
          }' > capacitor.config.json
          npx cap add android
          npx cap sync android

      - name: Generate App Icons
        run: |
          if [ -f "icon.png" ]; then
            mkdir -p assets
            cp icon.png assets/icon.png
            npx capacitor-assets generate --android
          fi

      - name: Patch Android (Immersive & Permissions)
        run: |
          # Разрешения на рекламу и вибро
          sed -i '/<\/manifest>/i \    <uses-permission android:name="com.google.android.gms.permission.AD_ID" />\n    <uses-permission android:name="android.permission.VIBRATE" />' android/app/src/main/AndroidManifest.xml
          
          # Скрываем кнопки навигации (Full Screen)
          FILE="android/app/src/main/java/com/arcade/hub/MainActivity.java"
          sed -i 's/public class MainActivity extends BridgeActivity {/public class MainActivity extends BridgeActivity {\n    @Override\n    public void onWindowFocusChanged(boolean hasFocus) {\n        super.onWindowFocusChanged(hasFocus);\n        if (hasFocus) {\n            getWindow().getDecorView().setSystemUiVisibility(android.view.View.SYSTEM_UI_FLAG_IMMERSIVE_STICKY | android.view.View.SYSTEM_UI_FLAG_LAYOUT_STABLE | android.view.View.SYSTEM_UI_FLAG_LAYOUT_HIDE_NAVIGATION | android.view.View.SYSTEM_UI_FLAG_LAYOUT_FULLSCREEN | android.view.View.SYSTEM_UI_FLAG_HIDE_NAVIGATION | android.view.View.SYSTEM_UI_FLAG_FULLSCREEN);\n        }\n    }/' $FILE

      - name: Create Release Key
        run: |
          keytool -genkey -v -keystore release.jks -keyalg RSA -keysize 2048 -validity 10000 -alias arcade-key -storepass arcade123 -keypass arcade123 -dname "CN=ArcadeHub, O=Dev, C=RU"

      - name: Build & Sign APK
        run: |
          cd android && chmod +x gradlew
          ./gradlew assembleRelease --no-daemon
          SIGNER=$(find $ANDROID_HOME/build-tools -name apksigner | sort -r | head -n 1)
          $SIGNER sign --ks ../release.jks --ks-key-alias arcade-key --ks-pass pass:arcade123 --key-pass pass:arcade123 --out ArcadeHub_Signed.apk app/build/outputs/apk/release/app-release-unsigned.apk

      - name: Upload Final APK
        uses: actions/upload-artifact@v4
        with:
          name: ArcadeHub_Production_Ready
          path: android/ArcadeHub_Signed.apk
