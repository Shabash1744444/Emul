name: Ultimate Production Release

on:
  workflow_dispatch:

jobs:
  build_and_sign:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node & Java
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          
      - name: Setup Java Environment
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Install Build Tools & Plugins
        run: |
          npm init -y
          npm install html-minifier-terser esbuild @capacitor/core @capacitor/cli @capacitor/android @capacitor/app @capacitor/browser @capacitor/filesystem @capacitor/share @capacitor/haptics @capacitor/assets fflate@0.8.2 libarchive.js@1.3.0

      - name: Minify & Heavy Packing
        run: |
          mkdir -p public
          
          # Сжатие HTML
          npx html-minifier-terser index.html --minify-js --collapse-whitespace --remove-comments --output public/index.html
          for f in *.html; do
            if [ "$f" != "index.html" ]; then
              npx html-minifier-terser "$f" --collapse-whitespace --output "public/$f"
            fi
          done

          # Бандлинг расширений
          if [ -f "arcade-extensions.js" ]; then
            npx esbuild arcade-extensions.js --bundle --minify --format=iife --outfile=public/arcade-extensions.bundle.js
          fi
          
          # Копирование ресурсов
          cp *.wasm *.wasm.js *.txt *.mp3 *.png *.json public/ 2>/dev/null || true
          find . -maxdepth 1 -name "*.js" ! -name "arcade-extensions.js" -exec cp {} public/ \;

          # Библиотеки
          cp node_modules/fflate/umd/index.js public/fflate.js
          cp node_modules/libarchive.js/main.js public/libarchive.js
          cp node_modules/libarchive.js/dist/worker-bundle.js public/worker-bundle.js

      - name: Capacitor Sync
        run: |
          echo '{
            "appId": "com.arcade.hub",
            "appName": "Arcade Hub",
            "webDir": "public",
            "bundledWebRuntime": false
          }' > capacitor.config.json
          npx cap add android
          npx cap sync android

      - name: Generate App Icons
        run: |
          if [ -f "icon.png" ]; then
            mkdir -p assets
            cp icon.png assets/icon.png
            npx capacitor-assets generate --android
          fi

      - name: Patch Android (Core Permissions & Smart WebChromeClient)
        run: |
          # 1. Прописываем разрешения строго перед <application> в манифесте
          sed -i '/<\/manifest>/i \    <uses-permission android:name="android.permission.CAMERA" />\n    <uses-permission android:name="android.permission.RECORD_AUDIO" />\n    <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" />\n    <uses-permission android:name="android.permission.VIBRATE" />\n    <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" />\n    <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" />\n    <uses-feature android:name="android.hardware.camera" android:required="false" />\n    <uses-feature android:name="android.hardware.camera.autofocus" android:required="false" />' android/app/src/main/AndroidManifest.xml
          
          # Разрешаем Legacy Storage для старых Android
          sed -i 's|<application|<application android:requestLegacyExternalStorage="true"|' android/app/src/main/AndroidManifest.xml

          # 2. ПОЛНАЯ ПЕРЕЗАПИСЬ MainActivity.java
          # Используем BridgeWebChromeClient для сохранения файлового менеджера и JIT запросов
          cat <<EOF > android/app/src/main/java/com/arcade/hub/MainActivity.java
          package com.arcade.hub;

          import android.os.Bundle;
          import android.Manifest;
          import android.content.pm.PackageManager;
          import android.webkit.PermissionRequest;
          import android.view.View;
          import androidx.core.app.ActivityCompat;
          import androidx.core.content.ContextCompat;
          import com.getcapacitor.BridgeActivity;
          import com.getcapacitor.BridgeWebChromeClient;
          import java.util.ArrayList;
          import java.util.List;

          public class MainActivity extends BridgeActivity {
              
              private PermissionRequest pendingRequest;

              @Override
              public void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  
                  // Расширяем РОДНОЙ клиент Capacitor. 
                  // Это сохраняет файловый загрузчик и дает нам JIT-запрос для камеры!
                  this.getBridge().getWebView().setWebChromeClient(new BridgeWebChromeClient(this.getBridge()) {
                      @Override
                      public void onPermissionRequest(final PermissionRequest request) {
                          pendingRequest = request;
                          List<String> perms = new ArrayList<>();
                          
                          for (String resource : request.getResources()) {
                              if (resource.equals(PermissionRequest.RESOURCE_VIDEO_CAPTURE)) {
                                  if (ContextCompat.checkSelfPermission(MainActivity.this, Manifest.permission.CAMERA) != PackageManager.PERMISSION_GRANTED) {
                                      perms.add(Manifest.permission.CAMERA);
                                  }
                              } else if (resource.equals(PermissionRequest.RESOURCE_AUDIO_CAPTURE)) {
                                  if (ContextCompat.checkSelfPermission(MainActivity.this, Manifest.permission.RECORD_AUDIO) != PackageManager.PERMISSION_GRANTED) {
                                      perms.add(Manifest.permission.RECORD_AUDIO);
                                  }
                              }
                          }
                          
                          if (perms.isEmpty()) {
                              MainActivity.this.runOnUiThread(new Runnable() {
                                  @Override
                                  public void run() {
                                      request.grant(request.getResources());
                                  }
                              });
                          } else {
                              ActivityCompat.requestPermissions(MainActivity.this, perms.toArray(new String[0]), 101);
                          }
                      }
                  });
              }

              @Override
              public void onRequestPermissionsResult(int requestCode, String[] permissions, int[] grantResults) {
                  super.onRequestPermissionsResult(requestCode, permissions, grantResults);
                  if (requestCode == 101 && pendingRequest != null) {
                      MainActivity.this.runOnUiThread(new Runnable() {
                          @Override
                          public void run() {
                              pendingRequest.grant(pendingRequest.getResources());
                              pendingRequest = null;
                          }
                      });
                  }
              }

              @Override
              public void onWindowFocusChanged(boolean hasFocus) {
                  super.onWindowFocusChanged(hasFocus);
                  if (hasFocus) {
                      getWindow().getDecorView().setSystemUiVisibility(
                          View.SYSTEM_UI_FLAG_IMMERSIVE_STICKY |
                          View.SYSTEM_UI_FLAG_LAYOUT_STABLE |
                          View.SYSTEM_UI_FLAG_LAYOUT_HIDE_NAVIGATION |
                          View.SYSTEM_UI_FLAG_LAYOUT_FULLSCREEN |
                          View.SYSTEM_UI_FLAG_HIDE_NAVIGATION |
                          View.SYSTEM_UI_FLAG_FULLSCREEN
                      );
                  }
              }
          }
          EOF

      - name: Create Release Key
        run: |
          keytool -genkey -v -keystore release.jks -keyalg RSA -keysize 2048 -validity 10000 -alias arcade-key -storepass arcade123 -keypass arcade123 -dname "CN=ArcadeHub, O=Dev, C=RU"

      - name: Build & Sign APK
        run: |
          cd android && chmod +x gradlew
          ./gradlew assembleRelease --no-daemon
          SIGNER=$(find $ANDROID_HOME/build-tools -name apksigner | sort -r | head -n 1)
          $SIGNER sign --ks ../release.jks --ks-key-alias arcade-key --ks-pass pass:arcade123 --key-pass pass:arcade123 --out ArcadeHub_Signed.apk app/build/outputs/apk/release/app-release-unsigned.apk

      - name: Send APK to Telegram
        uses: appleboy/telegram-action@master
        with:
          to: ${{ secrets.TELEGRAM_CHAT_ID }}
          token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          message: |
            🚀 **Arcade Hub: Финальная сборка APK!**
            
            Кнопка ДОБАВИТЬ работает. Запросы камеры/микрофона всплывают Just-In-Time.
          document: android/ArcadeHub_Signed.apk

      - name: Upload Artifact (Backup)
        uses: actions/upload-artifact@v4
        with:
          name: ArcadeHub_Production_Ready
          path: android/ArcadeHub_Signed.apk
