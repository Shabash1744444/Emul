name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Prepare Web Assets & Install Plugins
        run: |
          mkdir -p public
          cp index.html *.js *.wasm *.txt *.mp3 public/ 2>/dev/null || true
          
          npm init -y
          npm install fflate@0.8.2 libarchive.js@1.3.0
          # ИСПРАВЛЕНО: Добавлен @capacitor/share для выгрузки файлов
          npm install @capacitor/core @capacitor/cli @capacitor/android @capacitor/app @capacitor/haptics @capacitor/browser @capacitor/filesystem @capacitor/share esbuild
          
          cp node_modules/fflate/umd/index.js public/fflate.js
          cp node_modules/libarchive.js/main.js public/libarchive.js
          cp node_modules/libarchive.js/dist/worker-bundle.js public/worker-bundle.js
          
          npx esbuild arcade-extensions.js --bundle --format=iife --outfile=public/arcade-extensions.bundle.js

      - name: Capacitor Init & Sync
        run: |
          echo '{
            "appId": "com.arcade.hub",
            "appName": "Arcade Hub",
            "webDir": "public",
            "bundledWebRuntime": false
          }' > capacitor.config.json
          
          npx cap add android
          npx cap sync android

      - name: Generate Custom App Icon
        run: |
          if [ -f "icon.png" ]; then
            mkdir -p assets
            cp icon.png assets/icon.png
            npm install -D @capacitor/assets
            npx capacitor-assets generate --android
          fi

      - name: Inject Permissions & Hide Navigation Bar
        run: |
          sed -i 's/<application/<application android:requestLegacyExternalStorage="true" android:usesCleartextTraffic="true"/g' android/app/src/main/AndroidManifest.xml || true
          
          # Магия Node.js: Вживляем пермиссии и код для полноэкранного режима (Immersive Mode)
          node -e "
            const fs = require('fs');
            
            // 1. Добавляем разрешения в Manifest
            const manifestFile = 'android/app/src/main/AndroidManifest.xml';
            let manifestData = fs.readFileSync(manifestFile, 'utf8');
            const perms = '\n    <uses-permission android:name=\"android.permission.VIBRATE\" />\n    <uses-permission android:name=\"android.permission.INTERNET\" />\n    <uses-permission android:name=\"android.permission.READ_EXTERNAL_STORAGE\" />\n    <uses-permission android:name=\"android.permission.WRITE_EXTERNAL_STORAGE\" />\n    <uses-permission android:name=\"android.permission.MANAGE_EXTERNAL_STORAGE\" />\n';
            manifestData = manifestData.replace('</manifest>', perms + '</manifest>');
            fs.writeFileSync(manifestFile, manifestData);
            
            // 2. Прячем системные кнопки (Immersive Mode) в MainActivity.java
            const activityFile = 'android/app/src/main/java/com/arcade/hub/MainActivity.java';
            if (fs.existsSync(activityFile)) {
                let activityData = fs.readFileSync(activityFile, 'utf8');
                const immersiveCode = \`
    @Override
    public void onWindowFocusChanged(boolean hasFocus) {
        super.onWindowFocusChanged(hasFocus);
        if (hasFocus) {
            getWindow().getDecorView().setSystemUiVisibility(
                android.view.View.SYSTEM_UI_FLAG_IMMERSIVE_STICKY
                | android.view.View.SYSTEM_UI_FLAG_LAYOUT_STABLE
                | android.view.View.SYSTEM_UI_FLAG_LAYOUT_HIDE_NAVIGATION
                | android.view.View.SYSTEM_UI_FLAG_LAYOUT_FULLSCREEN
                | android.view.View.SYSTEM_UI_FLAG_HIDE_NAVIGATION
                | android.view.View.SYSTEM_UI_FLAG_FULLSCREEN);
        }
    }\`;
                activityData = activityData.replace('public class MainActivity extends BridgeActivity {', 'public class MainActivity extends BridgeActivity {' + immersiveCode);
                fs.writeFileSync(activityFile, activityData);
            }
          "

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ArcadeHub-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7
