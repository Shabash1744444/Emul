name: Ultimate Production Release

on:
  workflow_dispatch:

jobs:
  build_and_sign:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node & Java
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          
      - name: Setup Java Environment
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Install Build Tools & Plugins
        run: |
          npm init -y
          npm install html-minifier-terser esbuild @capacitor/core @capacitor/cli @capacitor/android @capacitor/app @capacitor/browser @capacitor/filesystem @capacitor/share @capacitor/haptics @capacitor/assets fflate@0.8.2 libarchive.js@1.3.0

      - name: Minify & Heavy Packing
        run: |
          mkdir -p public
          
          # 1. Мумифицируем HTML
          npx html-minifier-terser index.html --minify-js --collapse-whitespace --remove-comments --output public/index.html
          for f in *.html; do
            if [ "$f" != "index.html" ]; then
              npx html-minifier-terser "$f" --collapse-whitespace --output "public/$f"
            fi
          done

          # 2. Сжимаем расширения
          if [ -f "arcade-extensions.js" ]; then
            npx esbuild arcade-extensions.js --bundle --minify --format=iife --outfile=public/arcade-extensions.bundle.js
          fi
          
          # 3. Забираем ресурсы
          cp *.wasm *.wasm.js *.txt *.mp3 *.png *.json public/ 2>/dev/null || true
          find . -maxdepth 1 -name "*.js" ! -name "arcade-extensions.js" -exec cp {} public/ \;

          # 4. Копируем библиотеки
          cp node_modules/fflate/umd/index.js public/fflate.js
          cp node_modules/libarchive.js/main.js public/libarchive.js
          cp node_modules/libarchive.js/dist/worker-bundle.js public/worker-bundle.js

      - name: Capacitor Sync
        run: |
          echo '{
            "appId": "com.arcade.hub",
            "appName": "Arcade Hub",
            "webDir": "public",
            "bundledWebRuntime": false
          }' > capacitor.config.json
          npx cap add android
          npx cap sync android

      - name: Generate App Icons
        run: |
          if [ -f "icon.png" ]; then
            mkdir -p assets
            cp icon.png assets/icon.png
            npx capacitor-assets generate --android
          fi

      - name: Patch Android (System Permissions & Hard WebRTC Fix)
        run: |
          # 1. Патчим AndroidManifest.xml
          # Добавляем разрешения и объявляем камеру как фичу
          sed -i '/<\/manifest>/i \    <uses-permission android:name="com.google.android.gms.permission.AD_ID" />\n    <uses-permission android:name="android.permission.VIBRATE" />\n    <uses-permission android:name="android.permission.RECORD_AUDIO" />\n    <uses-permission android:name="android.permission.CAMERA" />\n    <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" />\n    <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" />\n    <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" />\n    <uses-feature android:name="android.hardware.camera" android:required="false" />' android/app/src/main/AndroidManifest.xml
          
          # Разрешаем Legacy Storage
          sed -i 's/<application/<application android:requestLegacyExternalStorage="true"/' android/app/src/main/AndroidManifest.xml

          # 2. Патчим MainActivity.java (Хард-запрос разрешений у Android)
          FILE="android/app/src/main/java/com/arcade/hub/MainActivity.java"
          
          # Добавляем нативные импорты Android для разрешений
          sed -i 's/import com.getcapacitor.BridgeActivity;/import com.getcapacitor.BridgeActivity;\nimport android.webkit.PermissionRequest;\nimport android.webkit.WebChromeClient;\nimport android.webkit.WebView;\nimport android.Manifest;\nimport android.content.pm.PackageManager;\nimport androidx.core.app.ActivityCompat;\nimport androidx.core.content.ContextCompat;/' $FILE
          
          # Инъекция кода, который заставит телефон ВЫКИНУТЬ ОКНО РАЗРЕШЕНИЯ
          sed -i 's/public class MainActivity extends BridgeActivity {/public class MainActivity extends BridgeActivity {\n\n    @Override\n    public void onStart() {\n        super.onStart();\n        \n        // Запрашиваем права у системы Android при каждом старте, если их нет\n        String[] perms = {Manifest.permission.CAMERA, Manifest.permission.RECORD_AUDIO, Manifest.permission.WRITE_EXTERNAL_STORAGE};\n        boolean needsPerms = false;\n        for (String p : perms) {\n            if (ContextCompat.checkSelfPermission(this, p) != PackageManager.PERMISSION_GRANTED) needsPerms = true;\n        }\n        if (needsPerms) ActivityCompat.requestPermissions(this, perms, 1);\n\n        // Настройка WebView для WebRTC\n        WebView webView = this.getBridge().getWebView();\n        webView.setWebChromeClient(new WebChromeClient() {\n            @Override\n            public void onPermissionRequest(final PermissionRequest request) {\n                MainActivity.this.runOnUiThread(new Runnable() {\n                    @Override\n                    public void run() {\n                        request.grant(request.getResources());\n                    }\n                });\n            }\n        });\n    }\n\n    @Override\n    public void onWindowFocusChanged(boolean hasFocus) {\n        super.onWindowFocusChanged(hasFocus);\n        if (hasFocus) {\n            getWindow().getDecorView().setSystemUiVisibility(android.view.View.SYSTEM_UI_FLAG_IMMERSIVE_STICKY | android.view.View.SYSTEM_UI_FLAG_LAYOUT_STABLE | android.view.View.SYSTEM_UI_FLAG_LAYOUT_HIDE_NAVIGATION | android.view.View.SYSTEM_UI_FLAG_LAYOUT_FULLSCREEN | android.view.View.SYSTEM_UI_FLAG_HIDE_NAVIGATION | android.view.View.SYSTEM_UI_FLAG_FULLSCREEN);\n        }\n    }/' $FILE

      - name: Create Release Key
        run: |
          keytool -genkey -v -keystore release.jks -keyalg RSA -keysize 2048 -validity 10000 -alias arcade-key -storepass arcade123 -keypass arcade123 -dname "CN=ArcadeHub, O=Dev, C=RU"

      - name: Build & Sign APK
        run: |
          cd android && chmod +x gradlew
          ./gradlew assembleRelease --no-daemon
          SIGNER=$(find $ANDROID_HOME/build-tools -name apksigner | sort -r | head -n 1)
          $SIGNER sign --ks ../release.jks --ks-key-alias arcade-key --ks-pass pass:arcade123 --key-pass pass:arcade123 --out ArcadeHub_Signed.apk app/build/outputs/apk/release/app-release-unsigned.apk

      - name: Send APK to Telegram
        uses: appleboy/telegram-action@master
        with:
          to: ${{ secrets.TELEGRAM_CHAT_ID }}
          token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          message: |
            🚀 **Arcade Hub: Билд с исправленной камерой!**
            
            Руслан, в этом APK при первом запуске телефон ДОЛЖЕН спросить разрешение на камеру.
          document: android/ArcadeHub_Signed.apk

      - name: Upload Artifact (Backup)
        uses: actions/upload-artifact@v4
        with:
          name: ArcadeHub_Production_Ready
          path: android/ArcadeHub_Signed.apk
