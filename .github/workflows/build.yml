name: Build RuStore Release APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Install Build Tools (Minifiers)
        run: |
          npm init -y
          # Ставим плагины и сжимальщики
          npm install terser html-minifier-terser fflate@0.8.2 libarchive.js@1.3.0
          npm install @capacitor/core @capacitor/cli @capacitor/android @capacitor/app @capacitor/haptics @capacitor/browser @capacitor/filesystem @capacitor/share esbuild

      - name: Prepare & Minify Web Assets
        run: |
          mkdir -p public
          
          # 1. Минифицируем основной index.html (удаляем комменты, пробелы, жмем инлайн-скрипты)
          npx html-minifier-terser index.html --minify-js true --collapse-whitespace true --remove-comments true --outfile public/index.html
          
          # 2. Копируем и жмем остальные HTML (если есть)
          for f in *.html; do
            if [ "$f" != "index.html" ]; then
              npx html-minifier-terser "$f" --collapse-whitespace true --outfile "public/$f"
            fi
          done

          # 3. Сжимаем JS расширения через esbuild (бусификация переменных)
          npx esbuild arcade-extensions.js --bundle --minify --format=iife --outfile=public/arcade-extensions.bundle.js
          
          # 4. Копируем ресурсы
          cp *.wasm *.txt *.mp3 public/ 2>/dev/null || true
          cp node_modules/fflate/umd/index.js public/fflate.js
          cp node_modules/libarchive.js/main.js public/libarchive.js
          cp node_modules/libarchive.js/dist/worker-bundle.js public/worker-bundle.js

      - name: Capacitor Init & Sync
        run: |
          echo '{
            "appId": "com.arcade.hub",
            "appName": "Arcade Hub",
            "webDir": "public",
            "bundledWebRuntime": false
          }' > capacitor.config.json
          
          npx cap add android
          npx cap sync android

      - name: Inject Permissions & Ad-ID & Immersive Mode
        run: |
          cat << 'EOF' > patch.js
          const fs = require('fs');
          
          // 1. Манифест: Добавляем разрешение на Рекламный ID и Вибро
          const manifestFile = 'android/app/src/main/AndroidManifest.xml';
          let manifestData = fs.readFileSync(manifestFile, 'utf8');
          const perms = `
    <uses-permission android:name="android.permission.VIBRATE" />
    <uses-permission android:name="android.permission.INTERNET" />
    <uses-permission android:name="com.google.android.gms.permission.AD_ID" />
    <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" />
    <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" />`;
          manifestData = manifestData.replace('</manifest>', perms + '\n</manifest>');
          
          // Включаем поддержку трафика для рекламы
          manifestData = manifestData.replace('<application', '<application android:usesCleartextTraffic="true"');
          fs.writeFileSync(manifestFile, manifestData);
          
          // 2. MainActivity.java: Режим "Полный экран" (чтобы не мешали кнопки Android)
          const activityFile = 'android/app/src/main/java/com/arcade/hub/MainActivity.java';
          if (fs.existsSync(activityFile)) {
              let activityData = fs.readFileSync(activityFile, 'utf8');
              const immersiveCode = `
          @Override
          public void onWindowFocusChanged(boolean hasFocus) {
              super.onWindowFocusChanged(hasFocus);
              if (hasFocus) {
                  getWindow().getDecorView().setSystemUiVisibility(
                      android.view.View.SYSTEM_UI_FLAG_IMMERSIVE_STICKY
                      | android.view.View.SYSTEM_UI_FLAG_LAYOUT_STABLE
                      | android.view.View.SYSTEM_UI_FLAG_LAYOUT_HIDE_NAVIGATION
                      | android.view.View.SYSTEM_UI_FLAG_LAYOUT_FULLSCREEN
                      | android.view.View.SYSTEM_UI_FLAG_HIDE_NAVIGATION
                      | android.view.View.SYSTEM_UI_FLAG_FULLSCREEN);
              }
          }`;
              activityData = activityData.replace('public class MainActivity extends BridgeActivity {', 'public class MainActivity extends BridgeActivity {' + immersiveCode);
              fs.writeFileSync(activityFile, activityData);
          }
          EOF
          node patch.js

      - name: Build Release APK
        run: |
          cd android
          chmod +x gradlew
          # Собираем версию для релиза (подписка будет дебажная, но RuStore для первого шага съест)
          ./gradlew assembleRelease --no-daemon

      - name: Upload Finished APK
        uses: actions/upload-artifact@v4
        with:
          name: ArcadeHub-Store-Ready
          path: android/app/build/outputs/apk/release/app-release-unsigned.apk
          retention-days: 7
