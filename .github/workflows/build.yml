name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Install Capacitor and Build APK
        run: |
          # Создаём структуру: public/ для веб-ассетов
          mkdir -p public
          cp index.html *.js *.wasm public/ 2>/dev/null || true
          
          cd public
          npm init -y
          npm install @capacitor/core @capacitor/cli @capacitor/android @capacitor/haptics
          
          # Инициализируем с webDir = public (текущая папка)
          npx cap init "Arcade Hub" "com.arcade.hub" --web-dir "public"
          npx cap add android
          
          # Права на вибрацию и cleartext
          sed -i 's/<application/<application android:usesCleartextTraffic="true"/g' android/app/src/main/AndroidManifest.xml
          sed -i '/<\/manifest>/i \    <uses-permission android:name="android.permission.VIBRATE" />' android/app/src/main/AndroidManifest.xml
          
          npx cap sync android
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ArcadeHub-APK
          path: public/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7
