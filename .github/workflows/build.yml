name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Prepare Web Assets & Install Plugins
        run: |
          mkdir -p public
          cp index.html *.js *.wasm *.txt public/ 2>/dev/null || true
          
          npm init -y
          # Ставим только самое необходимое ядро Capacitor (без лишних плагинов и esbuild)
          npm install @capacitor/core @capacitor/cli @capacitor/android

      - name: Capacitor Init & Sync
        run: |
          echo '{
            "appId": "com.arcade.hub",
            "appName": "Arcade Hub",
            "webDir": "public",
            "bundledWebRuntime": false
          }' > capacitor.config.json
          
          npx cap add android
          npx cap sync android

      - name: Generate Custom App Icon
        run: |
          if [ -f "icon.png" ]; then
            mkdir -p assets
            cp icon.png assets/icon.png
            npm install -D @capacitor/assets
            npx capacitor-assets generate --android
          fi

      - name: Inject Android Permissions
        run: |
          sed -i 's/<application/<application android:requestLegacyExternalStorage="true" android:usesCleartextTraffic="true"/g' android/app/src/main/AndroidManifest.xml || true
          
          # Оставляем права на вибрацию и файлы для ручного импорта
          node -e "
            const fs = require('fs');
            const file = 'android/app/src/main/AndroidManifest.xml';
            let data = fs.readFileSync(file, 'utf8');
            const perms = '\n    <uses-permission android:name=\"android.permission.VIBRATE\" />\n    <uses-permission android:name=\"android.permission.INTERNET\" />\n    <uses-permission android:name=\"android.permission.READ_EXTERNAL_STORAGE\" />\n    <uses-permission android:name=\"android.permission.WRITE_EXTERNAL_STORAGE\" />\n    <uses-permission android:name=\"android.permission.MANAGE_EXTERNAL_STORAGE\" />\n';
            data = data.replace('</manifest>', perms + '</manifest>');
            fs.writeFileSync(file, data);
          "

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ArcadeHub-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7
