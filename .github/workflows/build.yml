name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      # ФИКС: Используем официальный NPM вместо прямых ссылок! 
      # Это на 100% надежно и не вызывает ошибок скачивания.
      - name: Prepare Web Assets
        run: |
          mkdir -p public
          cp index.html *.js *.wasm public/ 2>/dev/null || true
          
          echo "📦 Устанавливаем библиотеки распаковки через официальный NPM..."
          npm install fflate@0.8.2 libarchive.js@1.3.0
          cp node_modules/fflate/umd/index.js public/fflate.js
          cp node_modules/libarchive.js/main.js public/libarchive.js
          cp node_modules/libarchive.js/dist/worker-bundle.js public/worker-bundle.js

      - name: Init Capacitor and Add Android
        run: |
          npm init -y
          npm install @capacitor/core@latest @capacitor/cli@latest @capacitor/android@latest @capacitor/haptics@latest @capacitor/browser@latest @capacitor/filesystem@latest
          npx cap init "Arcade Hub" "com.arcade.hub" --web-dir "public"
          npx cap add android

      - name: Generate Custom App Icon
        run: |
          if [ -f "icon.png" ]; then
            echo "🎨 Найдена кастомная иконка, генерируем..."
            mkdir -p assets
            cp icon.png assets/icon.png
            npm install -D @capacitor/assets
            npx capacitor-assets generate --android
          fi

      - name: Inject Android Permissions
        run: |
          sed -i 's/<application/<application android:requestLegacyExternalStorage="true" android:usesCleartextTraffic="true"/g' android/app/src/main/AndroidManifest.xml || true
          sed -i '/<\/manifest>/i \    <uses-permission android:name="android.permission.VIBRATE" />' android/app/src/main/AndroidManifest.xml || true
          sed -i '/<\/manifest>/i \    <uses-permission android:name="android.permission.INTERNET" />' android/app/src/main/AndroidManifest.xml || true
          sed -i '/<\/manifest>/i \    <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" />' android/app/src/main/AndroidManifest.xml || true
          sed -i '/<\/manifest>/i \    <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" />' android/app/src/main/AndroidManifest.xml || true

      - name: Sync and Build APK
        run: |
          npx cap sync android
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ArcadeHub-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7
