name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Prepare Web Assets & Install Plugins
        run: |
          mkdir -p public
          cp index.html *.js *.wasm public/ 2>/dev/null || true
          
          npm init -y
          npm install fflate@0.8.2 libarchive.js@1.3.0
          npm install @capacitor/core @capacitor/cli @capacitor/android @capacitor/haptics @capacitor/browser @capacitor/filesystem esbuild
          
          cp node_modules/fflate/umd/index.js public/fflate.js
          cp node_modules/libarchive.js/main.js public/libarchive.js
          cp node_modules/libarchive.js/dist/worker-bundle.js public/worker-bundle.js
          
          # Собираем все плагины + Haptics для вибрации
          echo "import { Filesystem, Directory } from '@capacitor/filesystem'; import { Browser } from '@capacitor/browser'; import { Haptics } from '@capacitor/haptics'; window.NativeFilesystem = Filesystem; window.NativeDirectory = Directory; window.NativeBrowser = Browser; window.Capacitor = { Plugins: { Haptics: Haptics, Browser: Browser, Filesystem: Filesystem }, isNativePlatform: () => true };" > plugins_setup.js
          npx esbuild plugins_setup.js --bundle --format=iife --outfile=public/plugins.js

      - name: Capacitor Init & Sync (Исправление Кимми)
        run: |
          # 1. Явно создаем конфиг, чтобы плагины знали куда цепляться
          echo '{
            "appId": "com.arcade.hub",
            "appName": "Arcade Hub",
            "webDir": "public",
            "bundledWebRuntime": false
          }' > capacitor.config.json
          
          # 2. Добавляем платформу и принудительно синхронизируем нативные плагины
          npx cap add android
          npx cap sync android

      - name: Generate Custom App Icon
        run: |
          if [ -f "icon.png" ]; then
            mkdir -p assets
            cp icon.png assets/icon.png
            npm install -D @capacitor/assets
            npx capacitor-assets generate --android
          fi

      - name: Inject Android Permissions
        run: |
          sed -i 's/<application/<application android:requestLegacyExternalStorage="true" android:usesCleartextTraffic="true"/g' android/app/src/main/AndroidManifest.xml || true
          
          # Жесткое добавление разрешений перед </manifest> через Node.js
          node -e "
            const fs = require('fs');
            const file = 'android/app/src/main/AndroidManifest.xml';
            let data = fs.readFileSync(file, 'utf8');
            const perms = '\n    <uses-permission android:name=\"android.permission.VIBRATE\" />\n    <uses-permission android:name=\"android.permission.INTERNET\" />\n    <uses-permission android:name=\"android.permission.READ_EXTERNAL_STORAGE\" />\n    <uses-permission android:name=\"android.permission.WRITE_EXTERNAL_STORAGE\" />\n    <uses-permission android:name=\"android.permission.MANAGE_EXTERNAL_STORAGE\" />\n';
            data = data.replace('</manifest>', perms + '</manifest>');
            fs.writeFileSync(file, data);
          "

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ArcadeHub-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7
