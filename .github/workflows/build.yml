name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Prepare Web Assets
        run: |
          mkdir -p public
          cp index.html *.js *.wasm public/ 2>/dev/null || true
          
          echo "📦 Устанавливаем зависимости и сборщик..."
          npm init -y
          npm install fflate@0.8.2 libarchive.js@1.3.0 @capacitor/core@latest @capacitor/cli@latest @capacitor/android@latest @capacitor/haptics@latest @capacitor/browser@latest @capacitor/filesystem@latest esbuild
          
          cp node_modules/fflate/umd/index.js public/fflate.js
          cp node_modules/libarchive.js/main.js public/libarchive.js
          cp node_modules/libarchive.js/dist/worker-bundle.js public/worker-bundle.js
          
          # Собираем радар и плагины Capacitor
          npx esbuild arcade-extensions.js --bundle --format=iife --outfile=public/arcade-extensions.bundle.js

      - name: Init Capacitor
        run: |
          npx cap init "Arcade Hub" "com.arcade.hub" --web-dir "public"
          npx cap add android

      - name: Generate Custom App Icon
        run: |
          if [ -f "icon.png" ]; then
            echo "🎨 Найдена кастомная иконка, генерируем..."
            mkdir -p assets
            cp icon.png assets/icon.png
            npm install -D @capacitor/assets
            npx capacitor-assets generate --android
          fi

      - name: Inject Android Permissions
        run: |
          # 100% надежный скрипт на Node.js для модификации Manifest
          node -e "
            const fs = require('fs');
            const file = 'android/app/src/main/AndroidManifest.xml';
            let data = fs.readFileSync(file, 'utf8');
            
            // Включаем поддержку старого хранилища для совместимости
            data = data.replace('<application', '<application android:requestLegacyExternalStorage=\"true\" android:usesCleartextTraffic=\"true\" ');
            
            // Железобетонно вшиваем разрешения перед закрывающим тегом
            const perms = '\n    <uses-permission android:name=\"android.permission.VIBRATE\" />\n    <uses-permission android:name=\"android.permission.INTERNET\" />\n    <uses-permission android:name=\"android.permission.READ_EXTERNAL_STORAGE\" />\n    <uses-permission android:name=\"android.permission.WRITE_EXTERNAL_STORAGE\" />\n    <uses-permission android:name=\"android.permission.MANAGE_EXTERNAL_STORAGE\" />\n';
            data = data.replace('</manifest>', perms + '</manifest>');
            
            fs.writeFileSync(file, data);
            console.log('✅ Разрешения успешно внедрены!');
          "
          # Выводим в лог, чтобы точно убедиться!
          cat android/app/src/main/AndroidManifest.xml

      - name: Sync and Build APK
        run: |
          npx cap sync android
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ArcadeHub-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7
