<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Ouroboros Arcade Hub</title>
    <style>
        :root {
            --bg-color-base: #060608;
            --glass-bg: rgba(15, 15, 25, 0.75);
            --glass-border: rgba(255, 255, 255, 0.1);
            --neon-blue: #38bdf8;
            --neon-purple: #a855f7;
            --neon-red: #ef4444;
            --neon-green: #10b981;
            --neon-smd: #38bdf8;
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        
        body {
            margin: 0; padding: 0; 
            background-color: var(--bg-color-base);
            /* Тот самый глубокий радиальный фон */
            background-image: radial-gradient(circle at 50% 0%, rgba(56, 189, 248, 0.15) 0%, rgba(0,0,0,0.95) 100%);
            color: #eee; 
            font-family: sans-serif; 
            min-height: 100vh;
            overflow-x: hidden;
            padding-bottom: 50px;
        }

        /* --- СТЕКЛЯННАЯ ШАПКА --- */
        .header {
            position: sticky; top: 0; z-index: 100;
            background: var(--glass-bg);
            backdrop-filter: blur(15px);
            padding: 15px;
            border-bottom: 1px solid var(--glass-border);
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.5);
        }

        .top-row {
            display: flex; justify-content: space-between; align-items: center;
            margin-bottom: 12px;
        }

        .back-btn {
            color: var(--neon-blue); font-weight: bold; cursor: pointer;
            text-shadow: 0 0 10px var(--neon-blue); font-size: 14px;
            text-decoration: none; text-transform: uppercase; letter-spacing: 1px;
        }

        /* --- КРАСИВЫЙ ПОИСК --- */
        .search-box {
            position: relative; margin-bottom: 15px;
        }
        .search-input {
            width: 100%; padding: 12px 15px 12px 40px; border-radius: 8px;
            background: rgba(0,0,0,0.6); border: 1px solid #333;
            color: #fff; font-size: 14px; outline: none; transition: 0.3s;
            box-shadow: inset 0 2px 5px rgba(0,0,0,0.5);
        }
        .search-input:focus {
            border-color: var(--neon-blue);
            box-shadow: 0 0 15px rgba(56, 189, 248, 0.3), inset 0 2px 5px rgba(0,0,0,0.5);
        }
        .search-icon {
            position: absolute; left: 12px; top: 50%; transform: translateY(-50%);
            color: #666; font-size: 16px;
        }

        /* --- НЕОНОВЫЕ ФИЛЬТРЫ --- */
        .filters {
            display: flex; gap: 10px; overflow-x: auto; padding-bottom: 5px;
            scrollbar-width: none;
        }
        .filters::-webkit-scrollbar { display: none; }
        
        .filter-btn {
            padding: 8px 16px; background: rgba(0,0,0,0.5); border: 1px solid #333;
            border-radius: 20px; color: #aaa; font-weight: bold; font-size: 11px;
            white-space: nowrap; cursor: pointer; transition: 0.3s; letter-spacing: 1px;
        }
        .filter-btn.active { background: var(--neon-blue); color: #000; border-color: var(--neon-blue); box-shadow: 0 0 10px var(--neon-blue); }

        /* --- СЕТКА И КАРТОЧКИ --- */
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
            gap: 15px; padding: 15px;
        }

        .game-card {
            background: #111; border-radius: 12px; overflow: hidden;
            border: 1px solid var(--glass-border); position: relative;
            display: flex; flex-direction: column; transition: 0.3s;
            box-shadow: 0 5px 15px rgba(0,0,0,0.5);
        }
        .game-card:active { transform: scale(0.96); }

        /* Цвета обводки по системам */
        .game-card.nes { border-top: 2px solid var(--neon-red); }
        .game-card.snes { border-top: 2px solid var(--neon-purple); }
        .game-card.gba { border-top: 2px solid var(--neon-green); }
        .game-card.smd { border-top: 2px solid var(--neon-smd); }

        .cover-container {
            width: 100%; aspect-ratio: 1/1; position: relative;
            background-size: cover; background-position: center;
            background-color: #0a0a0a; border-bottom: 1px solid #222;
        }

        .heart-icon {
            position: absolute; top: 8px; right: 8px; font-size: 18px;
            filter: drop-shadow(0 0 8px red); display: none; z-index: 10;
        }
        .game-card.installed .heart-icon { display: block; animation: pulse 2s infinite; }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.15); }
            100% { transform: scale(1); }
        }

        .sys-badge {
            position: absolute; top: 8px; left: 8px; background: rgba(0,0,0,0.8);
            padding: 2px 6px; border-radius: 4px; font-size: 9px; font-weight: bold;
            border: 1px solid #333; text-transform: uppercase;
        }

        .info-panel { padding: 10px; flex-grow: 1; display: flex; flex-direction: column; justify-content: space-between; }
        
        .game-title {
            font-size: 11px; font-weight: bold; color: #fff; margin-bottom: 10px;
            display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
            overflow: hidden; text-overflow: ellipsis; line-height: 1.3; height: 28px;
        }

        /* --- КНОПКИ ДЕЙСТВИЙ --- */
        .action-row { display: flex; gap: 6px; }
        
        .action-btn {
            flex: 1; padding: 8px 0; font-size: 9px; font-weight: bold;
            border-radius: 6px; border: 1px solid; background: rgba(0,0,0,0.5);
            cursor: pointer; text-align: center; transition: 0.2s; letter-spacing: 0.5px;
        }
        
        .btn-view {
            border-color: var(--neon-blue); color: var(--neon-blue);
            box-shadow: inset 0 0 5px rgba(56, 189, 248, 0.2);
        }
        .btn-install {
            border-color: var(--neon-green); color: var(--neon-green);
            box-shadow: inset 0 0 5px rgba(16, 185, 129, 0.2);
        }
        
        .action-btn:active { background: rgba(255,255,255,0.1); transform: scale(0.95); }
        
        .btn-install:disabled {
            border-color: #444; color: #666; box-shadow: none; cursor: default;
            background: transparent; transform: none;
        }

        .status-text {
            font-size: 9px; text-align: center; color: var(--neon-green); 
            margin-top: 5px; font-weight: bold; display: none; text-shadow: 0 0 5px var(--neon-green);
        }

    </style>
</head>
<body>

    <div class="header">
        <div class="top-row">
            <a href="index.html" class="back-btn">◀ НАЗАД В ЭМУЛЯТОР</a>
            <div style="font-size: 12px; color: #666; font-weight: bold; letter-spacing: 2px;">BAZA</div>
        </div>
        
        <div class="search-box">
            <span class="search-icon">🔍</span>
            <input type="text" id="searchInput" class="search-input" placeholder="Поиск по названию игры..." oninput="filterGames()">
        </div>

        <div class="filters">
            <div class="filter-btn active" onclick="setSystemFilter('all', this)">ВСЕ</div>
            <div class="filter-btn" onclick="setSystemFilter('nes', this)">NES</div>
            <div class="filter-btn" onclick="setSystemFilter('smd', this)">SEGA</div>
            <div class="filter-btn" onclick="setSystemFilter('snes', this)">SNES</div>
            <div class="filter-btn" onclick="setSystemFilter('gba', this)">GBA</div>
        </div>
    </div>

    <div class="grid" id="game-grid">
        </div>

    <script>
        // ИСПРАВЛЕННАЯ ССЫЛКА НА ЖЕЛЕЗОБЕТОННЫЙ РЕПОЗИТОРИЙ RAW
        const WAREHOUSE_URL = "https://raw.githubusercontent.com/crottorc91-oss/Baza/main/";
        
        let allGames = [];
        let installedGameNames = [];
        let currentSys = 'all';
        let db;

        // 1. ПОДКЛЮЧАЕМСЯ К БАЗЕ ДАННЫХ ЭМУЛЯТОРА
        const request = indexedDB.open("ArcadeDB", 1);
        request.onsuccess = (e) => { 
            db = e.target.result; 
            loadCatalog(); // Как только база готова, грузим склад
        };

        // 2. ЗАГРУЗКА СКЛАДА
        async function loadCatalog() {
            try {
                // Узнаем, что уже установлено
                installedGameNames = await getInstalledList();
                
                const res = await fetch(WAREHOUSE_URL + "master_registry.json");
                const data = await res.json();
                allGames = Array.isArray(data) ? data : data.games;
                renderGames();
            } catch (e) {
                document.getElementById('game-grid').innerHTML = "<p style='text-align:center; padding: 20px;'>Ошибка связи со складом.</p>";
            }
        }

        // 3. ОТРИСОВКА КАРТОЧЕК С ФИЛЬТРОМ
        function renderGames() {
            const grid = document.getElementById('game-grid');
            const query = document.getElementById('searchInput').value.toLowerCase();
            grid.innerHTML = '';
            
            allGames.forEach(game => {
                // Логика фильтрации (по системе и по тексту поиска)
                if (currentSys !== 'all' && game.sys !== currentSys) return;
                if (query && !game.title.toLowerCase().includes(query)) return;

                // Проверяем, есть ли игра в базе
                const isInstalled = installedGameNames.includes(game.title);
                
                // Формируем ссылку на картинку (если в json ее нет, пробуем подставить заглушку или сгенерировать)
                const coverUrl = game.image ? (WAREHOUSE_URL + game.image) : ''; 

                const card = document.createElement('div');
                card.className = `game-card ${game.sys} ${isInstalled ? 'installed' : ''}`;
                
                card.innerHTML = `
                    <div class="cover-container" style="background-image: url('${coverUrl}')">
                        <div class="sys-badge">${game.sys}</div>
                        <div class="heart-icon">❤️</div>
                    </div>
                    <div class="info-panel">
                        <div class="game-title" title="${game.title}">${game.title}</div>
                        
                        <div class="action-row">
                            <button class="action-btn btn-view" onclick="runPreview('${game.sys}', '${game.url}')">ПРОСМОТР</button>
                            <button class="action-btn btn-install" 
                                onclick="installSilent(this, '${game.sys}', '${game.url}', '${game.title.replace(/'/g, "\\'")}')" 
                                ${isInstalled ? 'disabled' : ''}>
                                ${isInstalled ? 'В БАЗЕ' : 'СКАЧАТЬ'}
                            </button>
                        </div>
                        <div class="status-text">УСТАНОВКА...</div>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        // 4. ЛОГИКА ФИЛЬТРОВ И ПОИСКА
        function filterGames() {
            renderGames(); // Просто перерисовываем с учетом текста в инпуте
        }

        function setSystemFilter(sys, btn) {
            currentSys = sys;
            document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            renderGames();
        }

        // 5. ТИХАЯ УСТАНОВКА НАПРЯМУЮ В БАЗУ ТЕЛЕФОНА
        async function installSilent(btnElement, sys, url, title) {
            const statusText = btnElement.parentElement.nextElementSibling;
            const card = btnElement.closest('.game-card');
            
            btnElement.style.display = 'none'; // Прячем кнопку
            statusText.style.display = 'block'; // Показываем загрузку

            try {
                // Качаем игру как бинарник
                const romRes = await fetch(WAREHOUSE_URL + url);
                if (!romRes.ok) throw new Error("404");
                const romBlob = await romRes.blob();
                
                // Открываем транзакцию в IndexedDB
                const tx = db.transaction("games", "readwrite");
                const store = tx.objectStore("games");
                
                // Записываем игру в базу эмулятора
                await store.put({
                    n: title,
                    s: sys,
                    d: romBlob,
                    i: null, // Иконку можно оставить пустой, эмулятор сгенерирует
                    t: Date.now()
                });

                // Успех! Зажигаем сердце и меняем кнопку
                statusText.style.display = 'none';
                btnElement.style.display = 'block';
                btnElement.disabled = true;
                btnElement.textContent = "В БАЗЕ";
                card.classList.add('installed');
                
                // Добавляем в локальный массив, чтобы при поиске не сбрасывалось
                installedGameNames.push(title);

            } catch (e) {
                statusText.textContent = "ОШИБКА!";
                statusText.style.color = "var(--neon-red)";
                setTimeout(() => {
                    statusText.style.display = 'none';
                    btnElement.style.display = 'block';
                }, 2000);
            }
        }

        // 6. ЗАПУСК ПЕСОЧНИЦЫ
        function runPreview(sys, url) {
            const fullUrl = WAREHOUSE_URL + url;
            // Кидаем в эмулятор спец. ссылку с флагом preview=true
            window.location.href = `index.html?sys=${sys}&rom=${encodeURIComponent(fullUrl)}&preview=true`;
        }

        // 7. ВСПОМОГАТЕЛЬНАЯ: ДОСТАТЬ СПИСОК УЖЕ СКАЧАННЫХ ИГР
        function getInstalledList() {
            return new Promise((resolve) => {
                if (!db) return resolve([]);
                const tx = db.transaction("games", "readonly");
                const store = tx.objectStore("games");
                const req = store.getAll();
                req.onsuccess = () => resolve(req.result.map(g => g.n));
                req.onerror = () => resolve([]);
            });
        }
    </script>
</body>
</html>
