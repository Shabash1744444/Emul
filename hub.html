<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arcade Hub + Debug Console</title>
    <style>
        * { margin:0; padding:0; box-sizing:border-box; }
        
        body { 
            background: #060608; 
            color: #fff; 
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            overflow-x: hidden;
        }
        
        /* ЛОГ-КОНСОЛЬ (всегда видна, даже поверх игры) */
        #debug-console {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            height: 200px;
            background: rgba(0,0,0,0.95);
            border-top: 3px solid #ef4444;
            z-index: 10000;
            display: flex;
            flex-direction: column;
            font-family: 'Courier New', monospace;
            font-size: 12px;
        }
        
        #debug-header {
            background: #111;
            padding: 8px 15px;
            border-bottom: 1px solid #333;
            display: flex;
            justify-content: space-between;
            align-items: center;
            color: #ef4444;
            font-weight: bold;
        }
        
        #debug-logs {
            flex: 1;
            overflow-y: auto;
            padding: 10px;
            color: #0f0;
        }
        
        .log-entry { 
            margin: 2px 0; 
            padding: 2px 0;
            border-left: 2px solid #444;
            padding-left: 8px;
            color: #aaa;
        }
        .log-hub { border-left-color: #38bdf8; color: #7dd3fc; }
        .log-emu { border-left-color: #a855f7; color: #d8b4fe; }
        .log-err { border-left-color: #ef4444; color: #fca5a5; background: rgba(239,68,68,0.1); }
        .log-ok { border-left-color: #10b981; color: #34d399; }
        
        /* КАТАЛОГ (отступ снизу для логов) */
        #catalog {
            padding: 20px;
            padding-bottom: 220px;
        }
        
        .header { 
            text-align: center; 
            padding: 30px 20px;
            background: linear-gradient(to bottom, rgba(56,189,248,0.1), transparent);
            border-bottom: 2px dashed #38bdf8;
            margin-bottom: 20px;
        }
        
        .header h1 { 
            font-family: monospace; 
            font-size: 32px; 
            text-shadow: 0 0 20px #38bdf8;
            margin-bottom: 10px;
        }
        
        .filters {
            display: flex;
            gap: 10px;
            overflow-x: auto;
            padding: 10px 0;
            margin-bottom: 20px;
            justify-content: center;
        }
        
        .filter-btn {
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.2);
            color: #fff;
            padding: 8px 16px;
            border-radius: 20px;
            cursor: pointer;
            white-space: nowrap;
            transition: 0.2s;
        }
        
        .filter-btn.active {
            background: rgba(56,189,248,0.2);
            border-color: #38bdf8;
            box-shadow: 0 0 15px rgba(56,189,248,0.3);
        }
        
        /* Сетка */
        .grid { 
            display: grid; 
            grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); 
            gap: 15px; 
            max-width: 1200px;
            margin: 0 auto;
        }
        
        .card {
            position: relative;
            aspect-ratio: 3/4;
            background: rgba(20,20,30,0.8);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 12px;
            overflow: hidden;
            cursor: pointer;
            background-size: cover;
            background-position: center;
            transition: transform 0.2s;
        }
        
        .card:hover { transform: translateY(-5px); box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        
        .card::before {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(to top, rgba(0,0,0,0.95) 0%, rgba(0,0,0,0.3) 60%, transparent 100%);
        }
        
        .heart {
            position: absolute;
            top: 8px;
            left: 8px;
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background: rgba(0,0,0,0.6);
            border: 1px solid rgba(255,255,255,0.3);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            z-index: 10;
            cursor: pointer;
            transition: all 0.3s;
        }
        
        .heart.saved {
            background: rgba(239, 68, 68, 0.9);
            border-color: #ef4444;
            box-shadow: 0 0 15px #ef4444, 0 0 30px rgba(239,68,68,0.6);
            animation: heartbeat 2s infinite;
        }
        
        @keyframes heartbeat {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.15); }
        }
        
        .heart.loading { animation: spin 1s linear infinite; background: rgba(245,158,11,0.8); }
        @keyframes spin { to { transform: rotate(360deg); } }
        
        .badge {
            position: absolute;
            top: 8px;
            right: 8px;
            padding: 4px 8px;
            border-radius: 6px;
            font-size: 10px;
            font-weight: bold;
            z-index: 10;
            text-transform: uppercase;
        }
        .badge-nes { background: #ef4444; }
        .badge-smd { background: #3b82f6; }
        .badge-snes { background: #a855f7; }
        .badge-gba { background: #d946ef; }
        .badge-ngp { background: #06b6d4; }
        .badge-dos { background: #10b981; }
        
        .title {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            padding: 12px;
            font-size: 12px;
            font-weight: bold;
            text-align: center;
            z-index: 5;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            text-shadow: 0 2px 4px rgba(0,0,0,0.8);
        }
        
        /* IFRAME ОВЕРЛЕЙ (игра внутри хаба!) */
        #game-frame-container {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 200px; /* Оставляем место для логов */
            background: #000;
            z-index: 9999;
            display: none;
        }
        
        #game-frame {
            width: 100%;
            height: 100%;
            border: none;
        }
        
        #close-game {
            position: absolute;
            top: 10px;
            right: 10px;
            background: #ef4444;
            color: #fff;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            cursor: pointer;
            z-index: 10001;
            font-weight: bold;
            box-shadow: 0 4px 15px rgba(239,68,68,0.4);
        }
        
        .progress-bar {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: 3px;
            background: rgba(255,255,255,0.1);
            z-index: 20;
        }
        .progress-fill {
            height: 100%;
            background: #10b981;
            width: 0%;
            transition: width 0.3s;
            box-shadow: 0 0 10px #10b981;
        }
    </style>
</head>
<body>

    <!-- ЛОГИ (никогда не исчезают) -->
    <div id="debug-console">
        <div id="debug-header">
            <span>📋 SYSTEM LOGS (Hub + Emulator)</span>
            <button onclick="clearLogs()" style="background:#333;color:#fff;border:none;padding:4px 10px;border-radius:4px;cursor:pointer;">Clear</button>
        </div>
        <div id="debug-logs"></div>
    </div>

    <!-- ИГРА ВО ФРЕЙМЕ (поверх каталога) -->
    <div id="game-frame-container">
        <button id="close-game" onclick="closeGame()">✖ ЗАКРЫТЬ ИГРУ</button>
        <iframe id="game-frame"></iframe>
    </div>

    <!-- КАТАЛОГ -->
    <div id="catalog">
        <div class="header">
            <h1>ARCADE HUB</h1>
            <div style="color:#64748b;font-size:14px;">Кликай по сердечку чтобы скачать, по карточке чтобы играть</div>
        </div>
        
        <div class="filters" id="filters">
            <button class="filter-btn active" onclick="filter('all', this)">ВСЕ</button>
        </div>
        
        <div class="grid" id="grid"></div>
    </div>

<script>
const WAREHOUSE = 'https://crottorc91-oss.github.io/Baza/';
let gamesList = [];
let downloaded = new Set();

// ЛОГГЕР (сохраняет в sessionStorage!)
const Logger = {
    log: function(msg, type='info', source='HUB') {
        const time = new Date().toLocaleTimeString();
        const entry = `[${time}] [${source}] ${msg}`;
        
        // В консоль
        console.log(entry);
        
        // В DOM
        const div = document.createElement('div');
        div.className = `log-entry log-${type}`;
        div.textContent = entry;
        document.getElementById('debug-logs').appendChild(div);
        document.getElementById('debug-logs').scrollTop = 999999;
        
        // В sessionStorage (чтобы не потерять при перезагрузке)
        let logs = JSON.parse(sessionStorage.getItem('logs') || '[]');
        logs.push({time, msg, type, source});
        sessionStorage.setItem('logs', JSON.stringify(logs.slice(-100))); // последние 100
    },
    
    restore: function() {
        // Восстанавливаем логи после перезагрузки
        const logs = JSON.parse(sessionStorage.getItem('logs') || '[]');
        logs.forEach(l => {
            const div = document.createElement('div');
            div.className = `log-entry log-${l.type || 'info'}`;
            div.style.opacity = '0.6'; // старые полупрозрачные
            div.textContent = `[${l.time}] [${l.source}] ${l.msg}`;
            document.getElementById('debug-logs').appendChild(div);
        });
        if (logs.length) this.log('--- Восстановлено после перезагрузки ---', 'info', 'SYS');
    }
};

function clearLogs() {
    sessionStorage.removeItem('logs');
    document.getElementById('debug-logs').innerHTML = '';
}

// Инициализация БД
const DB = {
    db: null,
    init: async function() {
        return new Promise((resolve) => {
            const req = indexedDB.open('HubCache', 1);
            req.onupgradeneeded = (e) => {
                e.target.result.createObjectStore('games', {keyPath: 'id'});
                Logger.log('Создано хранилище games', 'ok');
            };
            req.onsuccess = (e) => {
                this.db = e.target.result;
                Logger.log('База данных подключена', 'ok');
                resolve();
            };
        });
    },
    save: async function(id, data) {
        const tx = this.db.transaction('games', 'readwrite');
        tx.objectStore('games').put({id, ...data});
        downloaded.add(id);
    },
    get: async function(id) {
        return new Promise((resolve) => {
            const tx = this.db.transaction('games', 'readonly');
            const req = tx.objectStore('games').get(id);
            req.onsuccess = () => resolve(req.result);
        });
    },
    getAll: async function() {
        return new Promise((resolve) => {
            const tx = this.db.transaction('games', 'readonly');
            const req = tx.objectStore('games').getAll();
            req.onsuccess = () => {
                req.result.forEach(r => downloaded.add(r.id));
                resolve(req.result);
            };
        });
    }
};

// Загрузка
async function downloadGame(game, card) {
    const heart = card.querySelector('.heart');
    
    // Проверяем кеш
    const cached = await DB.get(game.url);
    if (cached) {
        Logger.log(`${game.title} уже в кеше`, 'ok');
        heart.classList.add('saved');
        heart.innerHTML = '❤️';
        return;
    }
    
    Logger.log(`Начинаю скачивание: ${game.title}`, 'info');
    heart.classList.add('loading');
    heart.innerHTML = '⏳';
    
    try {
        const response = await fetch(WAREHOUSE + game.url);
        const total = +response.headers.get('Content-Length');
        Logger.log(`Размер файла: ${(total/1024).toFixed(1)} KB`, 'info');
        
        const reader = response.body.getReader();
        const chunks = [];
        let received = 0;
        
        while (true) {
            const {done, value} = await reader.read();
            if (done) break;
            chunks.push(value);
            received += value.length;
            
            const pct = Math.round((received/total)*100);
            card.querySelector('.progress-fill').style.width = pct + '%';
            
            if (pct % 20 === 0) Logger.log(`Загрузка: ${pct}%`, 'info');
        }
        
        const blob = new Blob(chunks);
        const buffer = await blob.arrayBuffer();
        
        Logger.log(`Сохраняю в базу...`, 'info');
        await DB.save(game.url, {
            title: game.title,
            sys: game.sys,
            data: buffer,
            size: buffer.byteLength
        });
        
        Logger.log(`✅ ${game.title} готов к игре!`, 'ok');
        heart.classList.remove('loading');
        heart.classList.add('saved');
        heart.innerHTML = '❤️';
        
    } catch (err) {
        Logger.log(`❌ Ошибка: ${err.message}`, 'err');
        heart.classList.remove('loading');
        heart.innerHTML = '⬇️';
    }
}

// ИГРА ВО ФРЕЙМЕ (нет перехода - логи не теряются!)
function playGame(game) {
    const isSaved = downloaded.has(game.url);
    const container = document.getElementById('game-frame-container');
    const frame = document.getElementById('game-frame');
    
    Logger.log(`Запуск игры: ${game.title} (${isSaved ? 'OFFLINE' : 'ONLINE'})`, 'ok');
    
    // Формируем URL для эмулятора
    let url;
    if (isSaved) {
        // Передаем ID чтобы эмулятор взял из нашей БД
        url = `index.html?gameId=${encodeURIComponent(game.url)}&sys=${game.sys}&hub=1`;
    } else {
        // Онлайн режим
        url = `index.html?rom=${encodeURIComponent(WAREHOUSE + game.url)}&sys=${game.sys}&hub=1`;
    }
    
    frame.src = url;
    container.style.display = 'block';
    
    // Слушаем сообщения от iframe
    window.addEventListener('message', handleFrameMessage);
}

function handleFrameMessage(e) {
    if (e.data && e.data.log) {
        // Принимаем логи из iframe!
        Logger.log(e.data.msg, e.data.type || 'info', 'EMU');
    }
}

function closeGame() {
    document.getElementById('game-frame-container').style.display = 'none';
    document.getElementById('game-frame').src = 'about:blank';
    Logger.log('Игра закрыта', 'info');
}

// Рендер
async function init() {
    Logger.restore(); // Восстанавливаем старые логи
    
    await DB.init();
    const cached = await DB.getAll();
    Logger.log(`В локальном кеше: ${cached.length} игр`, 'info');
    
    // Загружаем каталог
    Logger.log('Загружаю каталог...');
    const res = await fetch(WAREHOUSE + 'master_registry.json');
    gamesList = await res.json();
    Logger.log(`Каталог получен: ${gamesList.length} игр`, 'ok');
    
    // Фильтры
    const systems = [...new Set(gamesList.map(g => g.sys))];
    const filterContainer = document.getElementById('filters');
    systems.forEach(sys => {
        const btn = document.createElement('button');
        btn.className = 'filter-btn';
        btn.textContent = sys.toUpperCase();
        btn.onclick = () => filter(sys, btn);
        filterContainer.appendChild(btn);
    });
    
    render();
}

function filter(sys, btn) {
    document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    render(sys);
}

function render(sysFilter = 'all') {
    const grid = document.getElementById('grid');
    grid.innerHTML = '';
    
    const filtered = sysFilter === 'all' ? gamesList : gamesList.filter(g => g.sys === sysFilter);
    
    filtered.forEach(game => {
        const isSaved = downloaded.has(game.url);
        const cover = WAREHOUSE + game.url.replace(/\.[^/.]+$/, '.png');
        
        const card = document.createElement('div');
        card.className = 'card';
        card.style.backgroundImage = `url('${cover}')`;
        
        card.innerHTML = `
            <div class="heart ${isSaved ? 'saved' : ''}" onclick="event.stopPropagation()">
                ${isSaved ? '❤️' : '⬇️'}
            </div>
            <div class="badge badge-${game.sys}">${game.sys}</div>
            <div class="progress-bar"><div class="progress-fill"></div></div>
            <div class="title">${game.title}</div>
        `;
        
        const heart = card.querySelector('.heart');
        heart.onclick = (e) => {
            e.stopPropagation();
            if (!isSaved) downloadGame(game, card);
        };
        
        card.onclick = () => playGame(game);
        
        // Проверка обложки
        const img = new Image();
        img.onload = () => {};
        img.onerror = () => { card.style.backgroundImage = 'none'; };
        img.src = cover;
        
        grid.appendChild(card);
    });
}

// Старт
window.addEventListener('load', init);
</script>

</body>
</html>
