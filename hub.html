<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Arcade Store</title>
    <style>
        :root {
            --bg-color-base: #060608;
            --glass-bg: rgba(15, 15, 25, 0.75);
            --glass-border: rgba(255, 255, 255, 0.1);
            --neon-blue: #38bdf8;
            --neon-purple: #a855f7;
            --neon-red: #ef4444;
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        
        body {
            margin: 0; padding: 0; 
            background-color: var(--bg-color-base);
            background-image: radial-gradient(circle at 50% 0%, rgba(56, 189, 248, 0.15) 0%, rgba(0,0,0,0.9) 100%);
            color: #eee; font-family: sans-serif; min-height: 100vh; overflow-x: hidden; padding-bottom: 50px;
        }

        /* --- ОРИГИНАЛЬНАЯ ШАПКА --- */
        .meme-header { 
            display: flex; flex-direction: column; align-items: center; justify-content: center; 
            padding: 40px 15px 20px 15px; border-bottom: 2px dashed var(--neon-blue); 
            background: rgba(8, 8, 12, 0.85); backdrop-filter: blur(15px); -webkit-backdrop-filter: blur(15px);
            border-radius: 0 0 20px 20px; margin-bottom: 20px;
            box-shadow: 0 8px 25px -5px rgba(56, 189, 248, 0.4);
        }
        .splash-title {
            color: #fff; font-family: monospace; font-size: 32px; font-weight: 900; letter-spacing: 5px; 
            text-shadow: 0 0 10px var(--neon-blue), 0 0 20px var(--neon-blue); text-align: center;
        }
        .splash-sub { color: #94a3b8; font-size: 12px; letter-spacing: 2px; margin-top: 5px; text-align: center;}

        /* ПОИСК */
        .search-box { width: 100%; max-width: 400px; margin-top: 15px; }
        .search-input {
            width: 100%; padding: 10px 15px; border-radius: 12px; background: rgba(0,0,0,0.5); 
            border: 1px solid var(--neon-blue); color: #fff; font-weight: bold; outline: none; text-align: center;
            box-shadow: inset 0 2px 5px rgba(0,0,0,0.5);
        }

        /* --- ФИЛЬТРЫ (ВОЗВРАЩЕНЫ) --- */
        .sys-filter-container { 
            display: flex; gap: 8px; overflow-x: auto; padding: 10px 15px; scrollbar-width: none; 
            align-items: center; justify-content: center; flex-wrap: wrap;
        }
        .sys-filter-container::-webkit-scrollbar { display: none; }
        
        .sys-filter-btn { 
            flex-shrink: 0; padding: 0 15px; height: 44px; border-radius: 12px; font-weight: 900; font-size: 13px; 
            cursor: pointer; color: #fff; border: 1px solid rgba(255,255,255,0.2); background: rgba(255,255,255,0.05); 
            text-transform: uppercase; transition: 0.2s; box-shadow: 0 4px 6px rgba(0,0,0,0.3); 
            display: flex; align-items: center; justify-content: center;
        }
        .sys-filter-btn.active { filter: brightness(1.5); box-shadow: inset 0 0 10px currentColor, 0 0 15px currentColor !important; border-width: 2px; }

        /* --- СЕТКА И КАРТОЧКИ --- */
        .grid { 
            display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 15px; 
            padding: 0 15px; max-width: 1200px; margin: 0 auto;
        }

        .game-card { 
            position: relative; overflow: hidden; background-color: var(--glass-bg); 
            backdrop-filter: blur(15px); -webkit-backdrop-filter: blur(15px);
            border: 1px solid var(--glass-border); border-radius: 12px; 
            display: flex; flex-direction: column; align-items: center; justify-content: flex-end; 
            transition: 0.2s; min-height: 180px; background-size: cover; background-position: center;
        }
        .game-card::before { 
            content: ''; position: absolute; inset: 0; 
            background: linear-gradient(to top, rgba(0,0,0,0.95) 0%, rgba(0,0,0,0.2) 60%, rgba(0,0,0,0.4) 100%); 
            z-index: 1; pointer-events: none; 
        }

        .game-title { 
            position: relative; z-index: 3; width: 100%; padding: 5px 8px; 
            font-size: 12px; font-weight: bold; text-align: center; color: #fff;
            text-shadow: 1px 1px 2px #000; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
        }

        .sys-badge { 
            position: absolute; top: 8px; right: 8px; padding: 4px 8px; border-radius: 6px; 
            font-size: 10px; font-weight: 900; z-index: 10; 
        }

        /* СЕРДЕЧКО */
        .install-heart {
            position: absolute; top: 8px; left: 8px; z-index: 10;
            font-size: 18px; filter: drop-shadow(0 0 5px red); display: none;
        }
        .installed .install-heart { display: block; }

        /* --- КНОПКИ ДЕЙСТВИЙ --- */
        .action-row { position: relative; z-index: 3; width: 100%; padding: 0 8px 10px 8px; display: flex; gap: 5px; }
        .action-btn {
            flex: 1; padding: 8px 0; border: 1px solid; border-radius: 6px; background: rgba(0,0,0,0.6);
            color: #fff; font-size: 9px; font-weight: 900; cursor: pointer; text-align: center; backdrop-filter: blur(5px);
        }
        .btn-view { border-color: var(--neon-blue); text-shadow: 0 0 5px var(--neon-blue); }
        .btn-inst { border-color: #10b981; text-shadow: 0 0 5px #10b981; }
        .btn-inst:disabled { border-color: #444; color: #666; text-shadow: none; cursor: default; }

        /* --- ЦВЕТОВОЙ НЕОН ПРИСТАВОК --- */
        .sys-nes { box-shadow: 0 0 15px rgba(239,68,68,0.3) !important; border-color: #ef4444; }
        .badge-nes { background: linear-gradient(135deg, #f87171, #ef4444); color: white; }
        .sys-smd { box-shadow: 0 0 15px rgba(59,130,246,0.3) !important; border-color: #3b82f6; }
        .badge-smd { background: linear-gradient(135deg, #60a5fa, #2563eb); color: white; }
        .sys-gba { box-shadow: 0 0 15px rgba(217,70,239,0.3) !important; border-color: #d946ef; }
        .badge-gba { background: linear-gradient(135deg, #e879f9, #c026d3); color: white; }
        .sys-snes { box-shadow: 0 0 15px rgba(168,85,247,0.3) !important; border-color: #a855f7; }
        .badge-snes { background: linear-gradient(135deg, #c084fc, #9333ea); color: white; }
        
        .loading-overlay { position: absolute; inset: 0; z-index: 5; background: rgba(0,0,0,0.7); display: none; align-items: center; justify-content: center; font-size: 10px; color: #10b981; font-weight: bold; }
    </style>
</head>
<body>

    <div class="meme-header">
        <a href="index.html" style="color: var(--neon-blue); text-decoration: none; font-weight: bold; margin-bottom: 10px; font-size: 14px; text-shadow: 0 0 10px var(--neon-blue);">◀ НАЗАД В МЕНЮ</a>
        <div class="splash-title">ARCADE STORE</div>
        <div class="splash-sub">ВЫБЕРИ ИГРУ ДЛЯ УСТАНОВКИ</div>
        
        <div class="search-box">
            <input type="text" id="searchInput" class="search-input" placeholder="Поиск по названию..." oninput="triggerSearch()">
        </div>
    </div>

    <div class="sys-filter-container" id="filter-bar">
        <button class="sys-filter-btn active" style="border-color:#fff; color:#fff;" onclick="filterGames('all', this)">ВСЕ</button>
    </div>

    <div class="grid" id="game-grid"></div>

    <script>
        // ДЛЯ JSON И КАРТИНОК ИСПОЛЬЗУЕМ GITHUB.IO (ЧТОБЫ НЕ БЫЛО CORS)
        const WAREHOUSE_URL = 'https://crottorc91-oss.github.io/Baza/';
        // ДЛЯ ZIP-АРХИВОВ ИСПОЛЬЗУЕМ RAW (ЧТОБЫ НЕ БЫЛО 404)
        const RAW_URL = 'https://raw.githubusercontent.com/crottorc91-oss/Baza/main/';
        
        let allGames = [];
        let installedNames = [];
        let db;

        const sysInfo = {
            'nes': { css: 'sys-nes', badge: 'badge-nes', name: 'DENDY', hex: '#ef4444' },
            'smd': { css: 'sys-smd', badge: 'badge-smd', name: 'SEGA', hex: '#3b82f6' },
            'gba': { css: 'sys-gba', badge: 'badge-gba', name: 'GBA', hex: '#d946ef' },
            'snes': { css: 'sys-snes', badge: 'badge-snes', name: 'SNES', hex: '#a855f7' }
        };

        // Подключение к базе ArcadeDB
        const request = indexedDB.open("ArcadeDB", 1);
        request.onsuccess = async (e) => { 
            db = e.target.result; 
            const tx = db.transaction("games", "readonly");
            const store = tx.objectStore("games");
            const req = store.getAll();
            req.onsuccess = () => {
                installedNames = req.result.map(g => g.n);
                loadCatalog();
            };
        };

        async function loadCatalog() {
            try {
                const response = await fetch(WAREHOUSE_URL + 'master_registry.json');
                allGames = await response.json();
                buildFilters();
                renderGames(allGames);
            } catch (e) {
                document.getElementById('game-grid').innerHTML = "<p style='text-align:center;'>Ошибка связи со складом</p>";
            }
        }

        function buildFilters() {
            const systems = [...new Set(allGames.map(g => g.sys))];
            const filterBar = document.getElementById('filter-bar');
            systems.forEach(sys => {
                const info = sysInfo[sys] || { name: sys.toUpperCase(), hex: '#fff' };
                const btn = document.createElement('button');
                btn.className = 'sys-filter-btn';
                btn.style.borderColor = info.hex;
                btn.style.color = info.hex;
                btn.textContent = info.name;
                btn.onclick = (e) => filterGames(sys, e.target);
                filterBar.appendChild(btn);
            });
        }

        function filterGames(sys, btn) {
            document.querySelectorAll('.sys-filter-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            renderGames(sys === 'all' ? allGames : allGames.filter(g => g.sys === sys));
        }

        function triggerSearch() {
            const q = document.getElementById('searchInput').value.toLowerCase();
            renderGames(allGames.filter(g => g.title.toLowerCase().includes(q)));
        }

        function renderGames(list) {
            const grid = document.getElementById('game-grid');
            grid.innerHTML = '';
            list.forEach(game => {
                const info = sysInfo[game.sys] || { css: '', badge: '', name: game.sys };
                const isInstalled = installedNames.includes(game.title);
                const card = document.createElement('div');
                card.className = `game-card ${info.css} ${isInstalled ? 'installed' : ''}`;
                card.style.backgroundImage = `url('${WAREHOUSE_URL}${game.image}')`;
                
                card.innerHTML = `
                    <div class="install-heart">❤️</div>
                    <div class="sys-badge ${info.badge}">${info.name}</div>
                    <div class="game-title">${game.title}</div>
                    <div class="action-row">
                        <button class="action-btn btn-view" onclick="runPreview('${game.sys}', '${game.url}')">ОБЗОР</button>
                        <button class="action-btn btn-inst" onclick="installSilent(this, '${game.sys}', '${game.url}', '${game.title}')" ${isInstalled ? 'disabled' : ''}>
                            ${isInstalled ? 'В БАЗЕ' : 'СКАЧАТЬ'}
                        </button>
                    </div>
                    <div class="loading-overlay">ЗАГРУЗКА...</div>
                `;
                grid.appendChild(card);
            });
        }

        async function installSilent(btn, sys, url, title) {
            const overlay = btn.closest('.game-card').querySelector('.loading-overlay');
            overlay.style.display = 'flex';
            try {
                const res = await fetch(RAW_URL + url);
                const blob = await res.blob();
                const tx = db.transaction("games", "readwrite");
                await tx.objectStore("games").put({ n: title, s: sys, d: blob, i: null, t: Date.now() });
                btn.disabled = true;
                btn.textContent = 'В БАЗЕ';
                btn.closest('.game-card').classList.add('installed');
                overlay.style.display = 'none';
            } catch (e) {
                overlay.innerText = "ОШИБКА";
                setTimeout(() => overlay.style.display = 'none', 2000);
            }
        }

        function runPreview(sys, url) {
            window.location.href = `index.html?sys=${sys}&rom=${encodeURIComponent(RAW_URL + url)}&preview=true`;
        }
    </script>
</body>
</html>
