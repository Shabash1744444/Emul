<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Arcade Hub</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        
        body {
            background: #060608;
            color: #eee;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            min-height: 100vh;
            padding-bottom: 200px;
        }

        /* Шапка */
        .header {
            background: rgba(8,8,12,0.9);
            border-bottom: 2px dashed #38bdf8;
            padding: 20px;
            position: sticky;
            top: 0;
            z-index: 100;
            backdrop-filter: blur(10px);
        }

        .title {
            font-family: monospace;
            font-size: 28px;
            font-weight: 900;
            text-align: center;
            text-shadow: 0 0 10px #38bdf8;
            letter-spacing: 3px;
        }

        /* Лог-панель (сверху, чтобы не мешала) */
        #log-panel {
            background: rgba(0,0,0,0.9);
            border-bottom: 2px solid #a855f7;
            padding: 10px;
            font-family: 'Courier New', monospace;
            font-size: 11px;
            max-height: 150px;
            overflow-y: auto;
            display: block;
        }

        #log-panel.hidden { display: none; }

        .log-entry {
            padding: 2px 0;
            border-left: 2px solid #38bdf8;
            padding-left: 8px;
            margin-bottom: 2px;
            animation: fadeIn 0.3s;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateX(-10px); }
            to { opacity: 1; transform: translateX(0); }
        }

        .log-error { border-left-color: #ef4444; color: #fca5a5; }
        .log-success { border-left-color: #10b981; color: #34d399; }
        .log-warn { border-left-color: #f59e0b; color: #fbbf24; }

        /* Поиск */
        .search-box {
            padding: 15px 20px;
        }

        .search-input {
            width: 100%;
            padding: 12px 20px;
            border-radius: 25px;
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.1);
            color: #fff;
            font-size: 14px;
            outline: none;
        }

        .search-input:focus {
            border-color: #38bdf8;
            box-shadow: 0 0 15px rgba(56,189,248,0.3);
        }

        /* Фильтры */
        .filters {
            display: flex;
            gap: 8px;
            overflow-x: auto;
            padding: 10px 20px;
            scrollbar-width: none;
        }

        .filters::-webkit-scrollbar { display: none; }

        .filter-btn {
            flex-shrink: 0;
            padding: 8px 16px;
            border-radius: 20px;
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.2);
            color: #fff;
            cursor: pointer;
            font-weight: 600;
            font-size: 12px;
            text-transform: uppercase;
            transition: 0.2s;
        }

        .filter-btn.active {
            background: rgba(56, 189, 248, 0.2);
            border-color: #38bdf8;
            box-shadow: 0 0 10px rgba(56,189,248,0.5);
        }

        /* Сетка */
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            gap: 15px;
            padding: 20px;
        }

        /* Карточка */
        .game-card {
            position: relative;
            aspect-ratio: 3/4;
            background: rgba(15,15,25,0.8);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 12px;
            overflow: hidden;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            background-size: cover;
            background-position: center;
        }

        .game-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        .game-card:active {
            transform: scale(0.95);
        }

        .game-card::before {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(to top, rgba(0,0,0,0.95) 0%, rgba(0,0,0,0.3) 60%, transparent 100%);
        }

        /* Сердечко - главная фича */
        .heart-btn {
            position: absolute;
            top: 8px;
            left: 8px;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: rgba(0,0,0,0.6);
            border: 1px solid rgba(255,255,255,0.3);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            z-index: 10;
            cursor: pointer;
            transition: all 0.3s;
            backdrop-filter: blur(5px);
        }

        .heart-btn:hover {
            transform: scale(1.1);
            background: rgba(255,255,255,0.2);
        }

        /* НЕОНОВОЕ СЕРДЕЧКО - установлено */
        .heart-btn.installed {
            background: rgba(239, 68, 68, 0.2);
            border-color: #ef4444;
            box-shadow: 0 0 10px #ef4444, 0 0 20px rgba(239,68,68,0.5);
            animation: heartbeat 2s infinite;
        }

        @keyframes heartbeat {
            0%, 100% { transform: scale(1); filter: brightness(1); }
            50% { transform: scale(1.1); filter: brightness(1.3); }
        }

        /* Скачивание */
        .heart-btn.downloading {
            background: rgba(245, 158, 11, 0.3);
            border-color: #f59e0b;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        /* Прогресс на карточке */
        .progress-bar {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: 3px;
            background: rgba(255,255,255,0.1);
            z-index: 20;
        }

        .progress-fill {
            height: 100%;
            background: #10b981;
            width: 0%;
            transition: width 0.3s;
            box-shadow: 0 0 10px #10b981;
        }

        /* Значок системы */
        .sys-badge {
            position: absolute;
            top: 8px;
            right: 8px;
            padding: 4px 8px;
            border-radius: 6px;
            font-size: 10px;
            font-weight: 900;
            z-index: 10;
            text-transform: uppercase;
            box-shadow: 0 2px 8px rgba(0,0,0,0.5);
        }

        .badge-nes { background: #ef4444; }
        .badge-smd { background: #3b82f6; }
        .badge-snes { background: #a855f7; }
        .badge-gba { background: #d946ef; }
        .badge-dos { background: #10b981; }
        .badge-ngp { background: #06b6d4; }
        .badge-html { background: #f59e0b; }

        .game-title {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            padding: 12px 8px;
            font-size: 12px;
            font-weight: bold;
            text-align: center;
            z-index: 5;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            text-shadow: 0 2px 4px rgba(0,0,0,0.8);
        }

        /* Пустое состояние */
        .empty {
            grid-column: 1/-1;
            text-align: center;
            padding: 60px 20px;
            color: #64748b;
            font-size: 14px;
        }

        /* Контролы */
        .controls {
            position: fixed;
            top: 20px;
            right: 20px;
            display: flex;
            gap: 10px;
            z-index: 101;
        }

        .control-btn {
            background: rgba(255,255,255,0.1);
            border: 1px solid rgba(255,255,255,0.2);
            color: #fff;
            padding: 8px 12px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 12px;
            backdrop-filter: blur(5px);
        }

        .control-btn:hover {
            background: rgba(255,255,255,0.2);
        }

        /* Иконка игры если нет обложки */
        .no-cover {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 40px;
            opacity: 0.3;
            z-index: 1;
        }
    </style>
</head>
<body>

    <div class="controls">
        <button class="control-btn" onclick="toggleLogs()">📝 Логи</button>
        <button class="control-btn" onclick="clearAllGames()">🗑 Очистить</button>
    </div>

    <div id="log-panel">
        <div style="color:#a855f7; font-weight:bold; margin-bottom:5px;">🖥️ SYSTEM LOGS</div>
    </div>

    <div class="header">
        <div class="title">ARCADE HUB</div>
    </div>

    <div class="search-box">
        <input type="text" class="search-input" id="searchInput" placeholder="Поиск игры..." oninput="filterGames()">
    </div>

    <div class="filters" id="filters">
        <button class="filter-btn active" onclick="setFilter('all', this)">Все</button>
    </div>

    <div class="grid" id="grid"></div>

    <script>
        // ==========================================
        // КОНФИГ (ПОМЕНЯЙ DEBUG НА false ДЛЯ ПРОДАКШЕНА)
        // ==========================================
        const CONFIG = {
            DEBUG_MODE: true,                                    // Показывать логи?
            WAREHOUSE_URL: 'https://crottorc91-oss.github.io/Baza/',
            DB_NAME: 'ArcadeHub_Storage',                       // Имя БД хаба
            DB_VERSION: 1,
            STORE_NAME: 'games'
        };

        // ==========================================
        // ЛОГГЕР (не пропадет при скачивании!)
        // ==========================================
        const Logger = {
            panel: document.getElementById('log-panel'),
            
            log(msg, type = 'info') {
                if (!CONFIG.DEBUG_MODE) return;
                
                console.log(`[${type.toUpperCase()}] ${msg}`);
                
                const entry = document.createElement('div');
                entry.className = `log-entry log-${type}`;
                entry.textContent = `[${new Date().toLocaleTimeString()}] ${msg}`;
                this.panel.appendChild(entry);
                this.panel.scrollTop = this.panel.scrollHeight;
                
                // Ограничиваем количество
                while (this.panel.children.length > 50) {
                    this.panel.removeChild(this.panel.children[1]); // 0 - это заголовок
                }
            },
            
            error(msg) { this.log(msg, 'error'); },
            success(msg) { this.log(msg, 'success'); },
            warn(msg) { this.log(msg, 'warn'); }
        };

        function toggleLogs() {
            document.getElementById('log-panel').classList.toggle('hidden');
        }

        // ==========================================
        // БАЗА ДАННЫХ (локальная для хаба)
        // ==========================================
        const Database = {
            db: null,
            
            async init() {
                Logger.log('Инициализация IndexedDB...');
                
                return new Promise((resolve, reject) => {
                    const request = indexedDB.open(CONFIG.DB_NAME, CONFIG.DB_VERSION);
                    
                    request.onerror = () => {
                        Logger.error('Ошибка открытия БД');
                        reject();
                    };
                    
                    request.onsuccess = (e) => {
                        this.db = e.target.result;
                        Logger.success(`БД подключена (v${this.db.version})`);
                        resolve();
                    };
                    
                    request.onupgradeneeded = (e) => {
                        Logger.log('Создание хранилища...');
                        const db = e.target.result;
                        if (!db.objectStoreNames.contains(CONFIG.STORE_NAME)) {
                            const store = db.createObjectStore(CONFIG.STORE_NAME, { keyPath: 'id' });
                            store.createIndex('sys', 'sys', { unique: false });
                        }
                    };
                });
            },
            
            async save(id, data) {
                return new Promise((resolve, reject) => {
                    const tx = this.db.transaction([CONFIG.STORE_NAME], 'readwrite');
                    const store = tx.objectStore(CONFIG.STORE_NAME);
                    const request = store.put({ id, ...data, savedAt: Date.now() });
                    
                    request.onsuccess = () => {
                        Logger.success(`Сохранено в БД: ${id}`);
                        resolve();
                    };
                    request.onerror = () => reject(request.error);
                });
            },
            
            async get(id) {
                return new Promise((resolve) => {
                    const tx = this.db.transaction([CONFIG.STORE_NAME], 'readonly');
                    const store = tx.objectStore(CONFIG.STORE_NAME);
                    const request = store.get(id);
                    request.onsuccess = () => resolve(request.result);
                    request.onerror = () => resolve(null);
                });
            },
            
            async getAll() {
                return new Promise((resolve) => {
                    const tx = this.db.transaction([CONFIG.STORE_NAME], 'readonly');
                    const store = tx.objectStore(CONFIG.STORE_NAME);
                    const request = store.getAll();
                    request.onsuccess = () => resolve(request.result);
                    request.onerror = () => resolve([]);
                });
            },
            
            async delete(id) {
                return new Promise((resolve) => {
                    const tx = this.db.transaction([CONFIG.STORE_NAME], 'readwrite');
                    const store = tx.objectStore(CONFIG.STORE_NAME);
                    store.delete(id);
                    tx.oncomplete = () => {
                        Logger.log(`Удалено: ${id}`);
                        resolve();
                    };
                });
            }
        };

        // ==========================================
        // ДАННЫЕ
        // ==========================================
        let allGames = [];
        let installedGames = new Map(); // id -> данные
        let currentFilter = 'all';
        let activeDownloads = new Map(); // id -> abortController

        // ==========================================
        // ЗАГРУЗКА КАТАЛОГА
        // ==========================================
        async function loadCatalog() {
            try {
                Logger.log('Загрузка каталога...');
                const response = await fetch(CONFIG.WAREHOUSE_URL + 'master_registry.json');
                allGames = await response.json();
                Logger.success(`Загружено ${allGames.length} игр`);
                
                createFilters();
                await loadInstalledGames();
                renderGames();
                
            } catch (e) {
                Logger.error(`Ошибка каталога: ${e.message}`);
            }
        }

        async function loadInstalledGames() {
            const games = await Database.getAll();
            installedGames.clear();
            games.forEach(g => installedGames.set(g.id, g));
            Logger.log(`В кеше игр: ${installedGames.size}`);
        }

        // ==========================================
        // ФИЛЬТРЫ И ПОИСК
        // ==========================================
        function createFilters() {
            const systems = [...new Set(allGames.map(g => g.sys))];
            const container = document.getElementById('filters');
            
            systems.forEach(sys => {
                const count = allGames.filter(g => g.sys === sys).length;
                const btn = document.createElement('button');
                btn.className = 'filter-btn';
                btn.textContent = `${sys.toUpperCase()} (${count})`;
                btn.onclick = () => setFilter(sys, btn);
                container.appendChild(btn);
            });
        }

        function setFilter(sys, btn) {
            document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            currentFilter = sys;
            renderGames();
        }

        function filterGames() {
            renderGames();
        }

        // ==========================================
        // РЕНДЕР
        // ==========================================
        function renderGames() {
            const grid = document.getElementById('grid');
            const search = document.getElementById('searchInput').value.toLowerCase();
            grid.innerHTML = '';
            
            let filtered = allGames;
            
            if (currentFilter !== 'all') {
                filtered = filtered.filter(g => g.sys === currentFilter);
            }
            
            if (search) {
                filtered = filtered.filter(g => g.title.toLowerCase().includes(search));
            }
            
            if (filtered.length === 0) {
                grid.innerHTML = '<div class="empty">Ничего не найдено</div>';
                return;
            }
            
            const sysColors = {
                nes: 'badge-nes', smd: 'badge-smd', snes: 'badge-snes',
                gba: 'badge-gba', dos: 'badge-dos', ngp: 'badge-ngp', html: 'badge-html'
            };
            
            filtered.forEach(game => {
                const isInstalled = installedGames.has(game.url);
                const isDownloading = activeDownloads.has(game.url);
                
                const card = document.createElement('div');
                card.className = 'game-card';
                card.style.backgroundImage = `url('${CONFIG.WAREHOUSE_URL + game.url.replace(/\.[^/.]+$/, '.png')}')`;
                
                // Прогресс-бар (если скачивается)
                const progressHtml = isDownloading ? '<div class="progress-bar"><div class="progress-fill" id="prog-'+game.url+'"></div></div>' : '';
                
                // Сердечко
                let heartIcon = '🤍';
                let heartClass = '';
                
                if (isInstalled) {
                    heartIcon = '❤️';
                    heartClass = 'installed';
                } else if (isDownloading) {
                    heartIcon = '⏳';
                    heartClass = 'downloading';
                }
                
                card.innerHTML = `
                    <div class="no-cover">🎮</div>
                    <div class="heart-btn ${heartClass}" onclick="handleHeart(event, '${game.url}', '${game.sys}', '${game.title.replace(/'/g, "\\'")}')" id="heart-${game.url}">
                        ${heartIcon}
                    </div>
                    <div class="sys-badge ${sysColors[game.sys] || 'badge-nes'}">${game.sys.toUpperCase()}</div>
                    ${progressHtml}
                    <div class="game-title">${game.title}</div>
                `;
                
                // Проверка обложки
                const img = new Image();
                img.onload = () => { 
                    const icon = card.querySelector('.no-cover');
                    if (icon) icon.style.display = 'none';
                };
                img.src = CONFIG.WAREHOUSE_URL + game.url.replace(/\.[^/.]+$/, '.png');
                
                // Клик по карточке = играть
                card.onclick = (e) => {
                    if (e.target.classList.contains('heart-btn')) return;
                    playGame(game);
                };
                
                grid.appendChild(card);
            });
        }

        // ==========================================
        // СКАЧИВАНИЕ (фоново, без выкидывания!)
        // ==========================================
        async function handleHeart(event, url, sys, title) {
            event.stopPropagation();
            
            const heart = document.getElementById(`heart-${url}`);
            
            // Если уже установлено - удалить
            if (installedGames.has(url)) {
                if (confirm('Удалить игру?')) {
                    await Database.delete(url);
                    installedGames.delete(url);
                    heart.classList.remove('installed');
                    heart.innerHTML = '🤍';
                }
                return;
            }
            
            // Если уже качается - отменить
            if (activeDownloads.has(url)) {
                activeDownloads.get(url).abort();
                activeDownloads.delete(url);
                heart.classList.remove('downloading');
                heart.innerHTML = '🤍';
                Logger.log(`Отменено: ${title}`);
                return;
            }
            
            // Начинаем скачивание
            Logger.log(`Начало скачивания: ${title}`);
            heart.classList.add('downloading');
            heart.innerHTML = '⏳';
            
            const controller = new AbortController();
            activeDownloads.set(url, controller);
            
            try {
                const fullUrl = CONFIG.WAREHOUSE_URL + url;
                const response = await fetch(fullUrl, { signal: controller.signal });
                
                if (!response.ok) throw new Error(`HTTP ${response.status}`);
                
                const total = +response.headers.get('Content-Length') || 0;
                const reader = response.body.getReader();
                const chunks = [];
                let received = 0;
                
                // Читаем поток с прогрессом
                while (true) {
                    const { done, value } = await reader.read();
                    if (done) break;
                    
                    chunks.push(value);
                    received += value.length;
                    
                    // Обновляем прогресс на карточке
                    if (total) {
                        const percent = (received / total) * 100;
                        const progBar = document.getElementById(`prog-${url}`);
                        if (progBar) progBar.style.width = percent + '%';
                    }
                }
                
                // Собираем blob
                const blob = new Blob(chunks);
                const buffer = await blob.arrayBuffer();
                
                Logger.success(`Скачано ${title}: ${(buffer.byteLength/1024).toFixed(1)}KB`);
                
                // Сохраняем в IndexedDB хаба
                await Database.save(url, {
                    title,
                    sys,
                    url,
                    data: buffer,
                    size: buffer.byteLength
                });
                
                installedGames.set(url, { title, sys });
                activeDownloads.delete(url);
                
                // Обновляем UI
                heart.classList.remove('downloading');
                heart.classList.add('installed');
                heart.innerHTML = '❤️';
                
                // Убираем прогресс-бар
                const progBar = document.getElementById(`prog-${url}`);
                if (progBar) progBar.parentElement.remove();
                
            } catch (e) {
                if (e.name === 'AbortError') {
                    Logger.log(`Отменено: ${title}`);
                } else {
                    Logger.error(`Ошибка скачивания ${title}: ${e.message}`);
                    heart.classList.remove('downloading');
                    heart.innerHTML = '❌';
                    setTimeout(() => {
                        heart.innerHTML = '🤍';
                    }, 2000);
                }
                activeDownloads.delete(url);
            }
        }

        // ==========================================
        // ЗАПУСК ИГРЫ (переход в эмулятор)
        // ==========================================
        function playGame(game) {
            const isInstalled = installedGames.has(game.url);
            
            if (isInstalled) {
                // Оффлайн режим - передаем данные через URL (data URI нельзя, поэтому используем shared array или просто говорим эмулятору взять из БД)
                // Вариант 1: Передаем флаг что нужно взять из БД хаба
                Logger.log(`Запуск оффлайн: ${game.title}`);
                window.location.href = `index.html?sys=${game.sys}&localGame=${encodeURIComponent(game.url)}`;
            } else {
                // Онлайн режим
                Logger.log(`Запуск онлайн: ${game.title}`);
                window.location.href = `index.html?sys=${game.sys}&rom=${encodeURIComponent(CONFIG.WAREHOUSE_URL + game.url)}`;
            }
        }

        // ==========================================
        // ОЧИСТКА
        // ==========================================
        async function clearAllGames() {
            if (!confirm('Удалить ВСЕ скачанные игры?')) return;
            
            const games = await Database.getAll();
            for (const game of games) {
                await Database.delete(game.id);
            }
            installedGames.clear();
            renderGames();
            Logger.success('Все игры удалены');
        }

        // ==========================================
        // СТАРТ
        // ==========================================
        window.addEventListener('DOMContentLoaded', async () => {
            await Database.init();
            await loadCatalog();
            
            // Обновляем статус каждые 5 сек (если другая вкладка добавила)
            setInterval(async () => {
                const before = installedGames.size;
                await loadInstalledGames();
                if (installedGames.size !== before) {
                    renderGames();
                }
            }, 5000);
        });

        // Обработка ошибок
        window.onerror = (msg, url, line) => {
            Logger.error(`JS Error: ${msg} (line ${line})`);
        };
    </script>

</body>
</html>
