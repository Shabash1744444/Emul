<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ouroboros Arcade Hub</title>
    <style>
        :root {
            --neon-cyan: #0ff;
            --neon-magenta: #f0f;
            --bg-dark: #0a0a0b;
            --card-bg: #151518;
        }

        body {
            font-family: 'Segoe UI', Roboto, sans-serif;
            background-color: var(--bg-dark);
            color: white;
            margin: 0;
            padding: 0;
            overflow-x: hidden;
        }

        header {
            padding: 40px 20px;
            text-align: center;
            background: radial-gradient(circle at center, #1a1a2e 0%, var(--bg-dark) 100%);
            border-bottom: 1px solid #333;
        }

        h1 {
            font-size: 2.5em;
            text-transform: uppercase;
            letter-spacing: 5px;
            margin: 0;
            text-shadow: 0 0 15px var(--neon-cyan);
            color: var(--neon-cyan);
        }

        /* Фильтр приставок */
        .filter-bar {
            display: flex;
            justify-content: center;
            gap: 15px;
            padding: 20px;
            flex-wrap: wrap;
            position: sticky;
            top: 0;
            background: rgba(10, 10, 11, 0.9);
            backdrop-filter: blur(10px);
            z-index: 100;
        }

        .filter-btn {
            background: transparent;
            border: 1px solid var(--neon-magenta);
            color: white;
            padding: 8px 20px;
            border-radius: 20px;
            cursor: pointer;
            text-transform: uppercase;
            font-size: 0.8em;
            transition: 0.3s;
        }

        .filter-btn:hover, .filter-btn.active {
            background: var(--neon-magenta);
            box-shadow: 0 0 15px var(--neon-magenta);
        }

        /* Сетка игр */
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
            gap: 25px;
            padding: 30px;
            max-width: 1200px;
            margin: 0 auto;
        }

        .game-card {
            background: var(--card-bg);
            border: 1px solid #222;
            border-radius: 12px;
            padding: 15px;
            position: relative;
            transition: 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
        }

        .game-card:hover {
            transform: translateY(-10px);
            border-color: var(--neon-cyan);
            box-shadow: 0 10px 30px rgba(0, 255, 255, 0.2);
        }

        /* Иконка системы */
        .sys-tag {
            font-size: 0.7em;
            padding: 2px 8px;
            border-radius: 4px;
            background: #222;
            color: #888;
            margin-bottom: 10px;
            border: 0.5px solid #444;
        }

        .game-title {
            font-size: 0.9em;
            font-weight: 600;
            height: 40px;
            overflow: hidden;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            margin-bottom: 15px;
        }

        /* Кнопка сердечко (Загрузить) */
        .action-btn {
            background: none;
            border: none;
            cursor: pointer;
            font-size: 1.5em;
            color: #444;
            transition: 0.3s;
            padding: 10px;
        }

        .action-btn:hover {
            color: var(--neon-magenta);
            transform: scale(1.2);
            filter: drop-shadow(0 0 5px var(--neon-magenta));
        }

        /* Анимация загрузки */
        .loading-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.9);
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .loader {
            width: 50px; height: 50px;
            border: 3px solid transparent;
            border-top-color: var(--neon-cyan);
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin { to { transform: rotate(360deg); } }

    </style>
</head>
<body>

    <div class="loading-overlay" id="loader">
        <div class="loader"></div>
        <p>Идет установка в систему...</p>
    </div>

    <header>
        <h1>ARCADE HUB</h1>
    </header>

    <div class="filter-bar" id="filter-bar">
        <button class="filter-btn active" onclick="filterGames('all')">Все игры</button>
    </div>

    <div class="grid" id="game-grid">
        </div>

    <script>
        const WAREHOUSE_URL = 'https://crottorc91-oss.github.io/Baza/';
        let allGames = [];

        // 1. Загрузка данных
        async function loadCatalog() {
            try {
                const response = await fetch(WAREHOUSE_URL + 'master_registry.json');
                allGames = await response.json();
                
                initFilters();
                renderGames(allGames);
            } catch (e) {
                console.error("Ошибка склада:", e);
                document.getElementById('game-grid').innerHTML = "<p>Склад временно недоступен</p>";
            }
        }

        // 2. Создание фильтров по приставкам
        function initFilters() {
            const systems = [...new Set(allGames.map(g => g.sys))];
            const filterBar = document.getElementById('filter-bar');
            
            systems.forEach(sys => {
                const btn = document.createElement('button');
                btn.className = 'filter-btn';
                btn.textContent = sys.toUpperCase();
                btn.onclick = (e) => {
                    document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
                    e.target.classList.add('active');
                    filterGames(sys);
                };
                filterBar.appendChild(btn);
            });
        }

        // 3. Отрисовка карточек
        function renderGames(gamesList) {
            const grid = document.getElementById('game-grid');
            grid.innerHTML = '';

            gamesList.forEach(game => {
                const card = document.createElement('div');
                card.className = 'game-card';
                card.innerHTML = `
                    <div class="sys-tag">${game.sys}</div>
                    <div class="game-title">${game.title}</div>
                    <button class="action-btn" title="Загрузить в эмулятор">❤</button>
                `;

                // Клик по сердечку или карточке
                card.onclick = () => installAndPlay(game);
                
                grid.appendChild(card);
            });
        }

        // 4. Фильтрация
        function filterGames(sys) {
            if (sys === 'all') {
                renderGames(allGames);
            } else {
                renderGames(allGames.filter(g => g.sys === sys));
            }
        }

        // 5. Логика "Установки" и перехода
        function installAndPlay(game) {
            const loader = document.getElementById('loader');
            loader.style.display = 'flex';

            // Имитация "установки" (тут можно вставить показ рекламы)
            setTimeout(() => {
                const fullUrl = WAREHOUSE_URL + game.url;
                const launchUrl = `index.html?sys=${game.sys}&rom=${encodeURIComponent(fullUrl)}`;
                
                // Переходим в основной эмулятор
                window.location.href = launchUrl;
            }, 1500); 
        }

        window.onload = loadCatalog;
    </script>
</body>
</html>
