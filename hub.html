<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Ouroboros Arcade Hub</title>
    <style>
        /* ВОЗВРАЩАЕМ ТВОИ ОРИГИНАЛЬНЫЕ ЦВЕТА И ПЕРЕМЕННЫЕ */
        :root {
            --bg-color-base: #060608;
            --glass-bg: rgba(15, 15, 25, 0.75);
            --glass-border: rgba(255, 255, 255, 0.1);
            --neon-blue: #38bdf8;
            --neon-purple: #a855f7;
            --neon-red: #ef4444;
            --neon-green: #10b981;
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        
        body {
            margin: 0; padding: 0; 
            background-color: var(--bg-color-base);
            background-image: radial-gradient(circle at 50% 0%, rgba(56, 189, 248, 0.15) 0%, rgba(0,0,0,0.9) 100%);
            color: #eee; font-family: sans-serif; min-height: 100vh; overflow-x: hidden;
        }

        /* ТВОЯ ОРИГИНАЛЬНАЯ ШАПКА */
        .header {
            position: sticky; top: 0; z-index: 100;
            background: var(--glass-bg); backdrop-filter: blur(15px);
            padding: 15px; border-bottom: 1px solid var(--glass-border);
        }

        .nav-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
        .back-link { color: var(--neon-blue); text-decoration: none; font-weight: bold; text-shadow: 0 0 10px var(--neon-blue); }

        /* ПОИСК В ТВОЕМ СТИЛЕ */
        .search-container { position: relative; margin-bottom: 15px; }
        .search-input {
            width: 100%; padding: 12px 15px; border-radius: 10px;
            background: rgba(0,0,0,0.5); border: 1px solid var(--glass-border);
            color: #fff; outline: none; transition: 0.3s;
        }
        .search-input:focus { border-color: var(--neon-blue); box-shadow: 0 0 15px rgba(56,189,248,0.2); }

        /* ТВОЯ СЕТКА КАРТОЧЕК */
        .grid {
            display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            gap: 20px; padding: 20px;
        }

        .game-card {
            background: var(--glass-bg); border-radius: 15px; overflow: hidden;
            border: 1px solid var(--glass-border); backdrop-filter: blur(5px);
            position: relative; transition: 0.3s; display: flex; flex-direction: column;
        }
        .game-card:hover { transform: translateY(-5px); border-color: var(--neon-blue); }

        .cover {
            width: 100%; aspect-ratio: 1/1; background-size: cover; background-position: center;
            position: relative; border-bottom: 1px solid var(--glass-border);
        }

        /* СИНХРОНИЗИРОВАННОЕ СЕРДЦЕ */
        .heart-icon {
            position: absolute; top: 10px; right: 10px; font-size: 20px;
            filter: drop-shadow(0 0 5px red); display: none;
        }
        .installed .heart-icon { display: block; }

        .info { padding: 12px; flex-grow: 1; }
        .game-title { font-size: 13px; font-weight: bold; margin-bottom: 10px; height: 32px; overflow: hidden; }

        /* КНОПКИ ДЕЙСТВИЯ */
        .actions { display: flex; gap: 8px; }
        .btn {
            flex: 1; padding: 8px 0; border-radius: 6px; border: 1px solid;
            background: transparent; color: #fff; cursor: pointer; font-size: 10px;
            font-weight: bold; transition: 0.2s; text-align: center;
        }
        .btn-view { border-color: var(--neon-blue); color: var(--neon-blue); }
        .btn-install { border-color: var(--neon-green); color: var(--neon-green); }
        .btn:active { transform: scale(0.95); background: rgba(255,255,255,0.05); }
        .btn:disabled { opacity: 0.3; cursor: default; }

        .loading-text { font-size: 10px; color: var(--neon-green); display: none; margin-top: 5px; text-align: center; }
    </style>
</head>
<body>

<div class="header">
    <div class="nav-row">
        <a href="index.html" class="back-link">◀ НАЗАД В МЕНЮ</a>
        <div style="font-size: 10px; opacity: 0.5;">OUROBOROS STORE</div>
    </div>
    
    <div class="search-container">
        <input type="text" id="search" class="search-input" placeholder="Поиск игры по названию..." oninput="render()">
    </div>
</div>

<div class="grid" id="grid"></div>

<script>
    // ИСПОЛЬЗУЕМ RAW ДЛЯ СТАБИЛЬНОСТИ
    const WAREHOUSE = "https://raw.githubusercontent.com/crottorc91-oss/Baza/main/";
    let allGames = [];
    let installedNames = [];
    let db;

    // Подключение к базе эмулятора
    const request = indexedDB.open("ArcadeDB", 1);
    request.onsuccess = (e) => { 
        db = e.target.result; 
        syncAndLoad(); 
    };

    async function syncAndLoad() {
        try {
            // 1. Узнаем, что уже в базе
            installedNames = await getInstalled();
            // 2. Качаем реестр
            const res = await fetch(WAREHOUSE + "master_registry.json");
            allGames = await res.json();
            render();
        } catch (e) {
            document.getElementById('grid').innerHTML = "<p style='grid-column: 1/-1; text-align:center;'>Ошибка связи со складом.</p>";
        }
    }

    async function render() {
        const grid = document.getElementById('grid');
        const query = document.getElementById('search').value.toLowerCase();
        grid.innerHTML = '';

        allGames.forEach(game => {
            if (query && !game.title.toLowerCase().includes(query)) return;

            const isInstalled = installedNames.includes(game.title);
            const card = document.createElement('div');
            card.className = `game-card ${isInstalled ? 'installed' : ''}`;
            
            card.innerHTML = `
                <div class="cover" style="background-image: url('${WAREHOUSE}${game.image}')">
                    <div class="heart-icon">❤️</div>
                </div>
                <div class="info">
                    <div class="game-title">${game.title}</div>
                    <div class="actions">
                        <button class="btn btn-view" onclick="run('${game.sys}', '${game.url}')">ПРОСМОТР</button>
                        <button class="btn btn-install" 
                            onclick="install(this, '${game.sys}', '${game.url}', '${game.title}', '${game.image}')"
                            ${isInstalled ? 'disabled' : ''}>
                            ${isInstalled ? 'В БАЗЕ' : 'СКАЧАТЬ'}
                        </button>
                    </div>
                    <div class="loading-text">ЗАГРУЗКА...</div>
                </div>
            `;
            grid.appendChild(card);
        });
    }

    // ТИХАЯ УСТАНОВКА
    async function install(btn, sys, url, title, img) {
        const loader = btn.parentElement.nextElementSibling;
        btn.style.display = 'none';
        loader.style.display = 'block';

        try {
            const rom = await fetch(WAREHOUSE + url).then(r => r.blob());
            const tx = db.transaction("games", "readwrite");
            await tx.objectStore("games").put({
                n: title, s: sys, d: rom, i: null, t: Date.now()
            });
            loader.innerText = "ГОТОВО!";
            btn.closest('.game-card').classList.add('installed');
            installedNames.push(title);
        } catch (e) {
            loader.innerText = "ОШИБКА";
            btn.style.display = 'block';
        }
    }

    function run(sys, url) {
        window.location.href = `index.html?sys=${sys}&rom=${encodeURIComponent(WAREHOUSE + url)}&preview=true`;
    }

    function getInstalled() {
        return new Promise((res) => {
            const tx = db.transaction("games", "readonly");
            const req = tx.objectStore("games").getAll();
            req.onsuccess = () => res(req.result.map(g => g.n));
        });
    }
</script>
</body>
</html>
