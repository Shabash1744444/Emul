<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Arcade Store Full</title>
    <style>
        :root {
            --bg-color-base: #060608;
            --glass-bg: rgba(15, 15, 25, 0.75);
            --glass-border: rgba(255, 255, 255, 0.1);
            --neon-blue: #38bdf8;
            --neon-purple: #a855f7;
            --neon-red: #ef4444;
            --neon-green: #10b981;
            --neon-cyan: #06b6d4;
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        
        body {
            margin: 0; padding: 0; 
            background-color: var(--bg-color-base);
            background-image: radial-gradient(circle at 50% 0%, rgba(56, 189, 248, 0.15) 0%, rgba(0,0,0,0.9) 100%);
            color: #eee; font-family: sans-serif; min-height: 100vh; overflow-x: hidden; padding-bottom: 50px;
        }

        /* --- ШАПКА --- */
        .meme-header { 
            display: flex; flex-direction: column; align-items: center; justify-content: center; 
            padding: 40px 15px 20px 15px; border-bottom: 2px dashed var(--neon-blue); 
            background: rgba(8, 8, 12, 0.85); backdrop-filter: blur(15px); -webkit-backdrop-filter: blur(15px);
            border-radius: 0 0 20px 20px; margin-bottom: 10px;
            box-shadow: 0 8px 25px -5px rgba(56, 189, 248, 0.4);
            position: relative;
        }
        .back-link {
            position: absolute; top: 15px; left: 15px; color: var(--neon-blue);
            text-decoration: none; font-size: 10px; font-weight: 900; letter-spacing: 1px;
        }
        .splash-title {
            color: #fff; font-family: monospace; font-size: 32px; font-weight: 900; letter-spacing: 5px; 
            text-shadow: 0 0 10px var(--neon-blue), 0 0 20px var(--neon-blue); text-align: center;
        }
        .splash-sub { color: #94a3b8; font-size: 10px; letter-spacing: 2px; margin-top: 5px; text-align: center; text-transform: uppercase;}

        /* ПОИСК */
        .search-box { width: 100%; max-width: 400px; margin-top: 15px; }
        .search-input {
            width: 100%; padding: 12px 15px; border-radius: 12px; background: rgba(0,0,0,0.5); 
            border: 1px solid var(--neon-blue); color: #fff; font-weight: bold; outline: none; text-align: center;
            box-shadow: inset 0 2px 5px rgba(0,0,0,0.5); transition: 0.3s;
        }
        .search-input:focus { box-shadow: 0 0 15px var(--neon-blue); }

        /* ФИЛЬТРЫ */
        .sys-filter-container { 
            display: flex; gap: 8px; overflow-x: auto; padding: 15px; 
            scrollbar-width: none; align-items: center; justify-content: center; flex-wrap: wrap; 
        }
        .sys-filter-container::-webkit-scrollbar { display: none; }
        .sys-filter-btn { 
            flex-shrink: 0; padding: 0 15px; height: 38px; border-radius: 10px; font-weight: 900; font-size: 10px; 
            cursor: pointer; color: #fff; border: 1px solid rgba(255,255,255,0.1); background: rgba(255,255,255,0.05); 
            text-transform: uppercase; transition: 0.2s; display: flex; align-items: center; justify-content: center;
        }
        .sys-filter-btn.active { filter: brightness(1.2); box-shadow: inset 0 0 10px currentColor; border-width: 2px; }

        /* СЕТКА */
        .grid { 
            display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); 
            gap: 15px; padding: 0 15px; max-width: 1200px; margin: 0 auto; 
        }

        /* КАРТОЧКА */
        .game-card { 
            position: relative; overflow: hidden; background-color: var(--glass-bg); backdrop-filter: blur(15px);
            border: 1px solid var(--glass-border); border-radius: 16px; display: flex; flex-direction: column; 
            align-items: center; justify-content: flex-end; transition: 0.2s; min-height: 190px; 
            background-size: cover; background-position: center; cursor: pointer;
        }
        .game-card:active { transform: scale(0.96); }
        .game-card::before { 
            content: ''; position: absolute; inset: 0; 
            background: linear-gradient(to top, rgba(0,0,0,0.9) 0%, rgba(0,0,0,0.2) 60%, rgba(0,0,0,0.4) 100%); 
            z-index: 1; pointer-events: none;
        }

        .game-title { 
            position: relative; z-index: 3; width: 100%; padding: 10px 8px; font-size: 11px; 
            font-weight: bold; text-align: center; color: #fff; text-shadow: 1px 1px 2px #000; 
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis; 
        }

        /* --- КНОПКА СКАЧИВАНИЯ (СЕРДЦЕ) --- */
        .heart-btn {
            position: absolute; top: 10px; right: 10px; z-index: 10;
            width: 36px; height: 36px; background: rgba(0,0,0,0.6); 
            border: 1px solid rgba(255,255,255,0.2); border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            transition: 0.3s; cursor: pointer; backdrop-filter: blur(5px);
        }
        .heart-btn svg { width: 16px; height: 16px; fill: none; stroke: rgba(255,255,255,0.6); stroke-width: 2; transition: 0.3s; }
        .heart-btn:active { transform: scale(0.8); }
        
        /* Анимация загрузки */
        .heart-btn.loading svg { animation: heartbeat 1s linear infinite; stroke: var(--neon-red); }
        
        /* Состояние "Установлено" (СИЯНИЕ И ЭМОДЗИ) */
        .installed .heart-btn { 
            border-color: var(--neon-red); 
            background: rgba(239, 68, 68, 0.15); 
            box-shadow: 0 0 20px rgba(239, 68, 68, 0.8), inset 0 0 10px rgba(239, 68, 68, 0.4); 
        }
        .installed .heart-btn::after { 
            content: '❤️'; 
            position: absolute;
            font-size: 18px; 
            filter: drop-shadow(0 0 8px red); 
            animation: heartbeat 1.5s infinite; 
        }
        .installed .heart-btn svg { display: none; } /* Прячем контур, когда игра установлена */

        @keyframes heartbeat { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.2); } }

        /* БЕЙДЖИ */
        .sys-badge { position: absolute; top: 10px; left: 10px; padding: 4px 8px; border-radius: 6px; font-size: 9px; font-weight: 900; z-index: 5; color: #fff; text-transform: uppercase; }

        /* СИСТЕМНЫЕ СТИЛИ (NGP теперь бирюзовый) */
        .sys-nes { border-color: var(--neon-red); } .badge-nes { background: var(--neon-red); }
        .sys-smd { border-color: var(--neon-blue); } .badge-smd { background: var(--neon-blue); }
        .sys-gba { border-color: var(--neon-purple); } .badge-gba { background: var(--neon-purple); }
        .sys-snes { border-color: #8b5cf6; } .badge-snes { background: #8b5cf6; }
        .sys-ngp { border-color: var(--neon-cyan); } .badge-ngp { background: var(--neon-cyan); }

        .no-cover-icon { position: absolute; top: 40%; left: 50%; transform: translate(-50%, -50%); font-size: 10px; font-weight: bold; color: rgba(255,255,255,0.2); letter-spacing: 2px; z-index: 2; opacity: 0.8; }
    </style>
</head>
<body>

    <div class="meme-header">
        <a href="index.html#menu" class="back-link">◀ НАЗАД</a>
        <div class="splash-title">ARCADE STORE</div>
        <div class="splash-sub">QUANTUM ROM STORAGE</div>
        <div class="search-box">
            <input type="text" id="searchInput" class="search-input" placeholder="ПОИСК ПО БАЗЕ..." oninput="triggerSearch()">
        </div>
    </div>

    <div class="sys-filter-container" id="filter-bar">
        <button class="sys-filter-btn active" style="color:#fff; border-color:#fff;" onclick="filterGames('all', this)">ВСЕ</button>
    </div>

    <div class="grid" id="game-grid"></div>

    <script>
        const WAREHOUSE_URL = 'https://crottorc91-oss.github.io/Baza/';
        const RAW_URL = 'https://raw.githubusercontent.com/crottorc91-oss/Baza/main/';
        
        let allGames = [];
        let installedMap = new Map(); 
        let db;

        const sysInfo = {
            'nes': { css: 'sys-nes', badge: 'badge-nes', name: 'NES', color: '#ef4444' },
            'smd': { css: 'sys-smd', badge: 'badge-smd', name: 'SMD', color: '#38bdf8' },
            'gba': { css: 'sys-gba', badge: 'badge-gba', name: 'GBA', color: '#a855f7' },
            'snes': { css: 'sys-snes', badge: 'badge-snes', name: 'SNES', color: '#8b5cf6' },
            'ngp': { css: 'sys-ngp', badge: 'badge-ngp', name: 'NGP', color: '#06b6d4' } // Бирюзовый цвет!
        };

        // Помощник для эмулятора
        function getCoreType(sys) {
            if (sys === 'nes') return 'n';
            if (sys === 'dos') return 'd';
            if (sys === 'html') return 'h';
            return 'l'; // libretro
        }

        // --- ИНИЦИАЛИЗАЦИЯ ARCADE DB ---
        const request = indexedDB.open("ArcadeDB", 1);
        request.onupgradeneeded = (e) => {
            db = e.target.result;
            if (!db.objectStoreNames.contains("games")) {
                db.createObjectStore("games", { keyPath: "id", autoIncrement: true });
            }
        };

        request.onsuccess = (e) => { 
            db = e.target.result; 
            syncWithLocal().then(() => loadCatalog());
        };

        async function syncWithLocal() {
            return new Promise((resolve) => {
                const tx = db.transaction("games", "readonly");
                const store = tx.objectStore("games");
                store.getAll().onsuccess = (ev) => {
                    installedMap.clear();
                    ev.target.result.forEach(g => {
                        if (g.n) installedMap.set(g.n, g.id); // Синхрон строго по имени (n)
                    });
                    resolve();
                };
            });
        }

        async function loadCatalog() {
            try {
                const res = await fetch(WAREHOUSE_URL + 'master_registry.json');
                allGames = await res.json();
                buildFilters();
                renderGames(allGames);
            } catch (e) { console.error("Cloud error", e); }
        }

        function buildFilters() {
            const systems = [...new Set(allGames.map(g => g.sys))];
            const bar = document.getElementById('filter-bar');
            systems.forEach(sys => {
                const info = sysInfo[sys] || { name: sys.toUpperCase(), color: '#fff' };
                const btn = document.createElement('button');
                btn.className = 'sys-filter-btn';
                btn.style.color = info.color;
                btn.style.borderColor = info.color + '44';
                btn.textContent = info.name;
                btn.onclick = (e) => filterGames(sys, e.target);
                bar.appendChild(btn);
            });
        }

        function filterGames(sys, btn) {
            document.querySelectorAll('.sys-filter-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            const filtered = sys === 'all' ? allGames : allGames.filter(g => g.sys === sys);
            renderGames(filtered);
        }

        function triggerSearch() {
            const q = document.getElementById('searchInput').value.toLowerCase();
            renderGames(allGames.filter(g => g.title.toLowerCase().includes(q)));
        }

        function renderGames(list) {
            const grid = document.getElementById('game-grid');
            grid.innerHTML = '';
            
            const heartSvg = `<svg viewBox="0 0 24 24"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"></path></svg>`;

            list.forEach(game => {
                const info = sysInfo[game.sys] || { css: '', badge: '', name: game.sys };
                const isInst = installedMap.has(game.title);
                const localId = isInst ? installedMap.get(game.title) : null;
                const cover = WAREHOUSE_URL + game.url.replace('.zip', '.png');

                const card = document.createElement('div');
                card.className = `game-card ${info.css} ${isInst ? 'installed' : ''}`;
                card.style.backgroundImage = `url('${cover}')`;
                
                card.onclick = (e) => {
                    if (e.target.closest('.heart-btn')) return; 
                    launchGame(game, isInst, localId);
                };

                card.innerHTML = `
                    <div class="heart-btn" onclick="installGame(event, this, '${game.sys}', '${game.url}', '${game.title.replace(/'/g, "\\'")}')">
                        ${heartSvg}
                    </div>
                    <div class="no-cover-icon">NO COVER</div>
                    <div class="sys-badge ${info.badge}">${info.name}</div>
                    <div class="game-title">${game.title}</div>
                `;

                const img = new Image();
                img.onload = () => { if(card.querySelector('.no-cover-icon')) card.querySelector('.no-cover-icon').style.display='none'; };
                img.src = cover;

                grid.appendChild(card);
            });
        }

        // --- ЛОГИКА СКАЧИВАНИЯ С ИДЕАЛЬНОЙ БД ---
        async function installGame(event, btn, sys, url, title) {
            event.stopPropagation();
            if (btn.parentElement.classList.contains('installed')) return;

            btn.classList.add('loading');

            try {
                const res = await fetch(RAW_URL + url);
                const blob = await res.blob();
                
                const tx = db.transaction("games", "readwrite");
                const store = tx.objectStore("games");
                
                // ВАЖНО: сохраняем 1-в-1 как в твоем основном эмуляторе
                const ext = url.split('.').pop();
                const req = store.put({
                    n: title,
                    sys: sys,
                    ext: ext,
                    t: getCoreType(sys),
                    fileBlob: blob,
                    timestamp: Date.now()
                });

                req.onsuccess = (e) => {
                    installedMap.set(title, e.target.result);
                    btn.classList.remove('loading');
                    btn.parentElement.classList.add('installed');
                };
            } catch (e) {
                btn.classList.remove('loading');
                console.error(e);
            }
        }

        // --- ЗАПУСК ---
        function launchGame(game, isInst, localId) {
            // Если твой основной файл называется иначе, поменяй 'index.html' здесь
            const base = `index.html?sys=${game.sys}&hub=1`;
            if (isInst) {
                window.location.href = `${base}&localGame=${localId}`;
            } else {
                const fullUrl = RAW_URL + game.url;
                window.location.href = `${base}&rom=${encodeURIComponent(fullUrl)}&preview=true`;
            }
        }
    </script>
</body>
</html>
