<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Arcade Store</title>
    <style>
        :root {
            --bg-color-base: #060608;
            --glass-bg: rgba(15, 15, 25, 0.75);
            --glass-border: rgba(255, 255, 255, 0.1);
            --neon-blue: #38bdf8;
            --neon-purple: #a855f7;
            --neon-red: #ef4444;
            --neon-green: #10b981;
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        
        body {
            margin: 0; padding: 0; 
            background-color: var(--bg-color-base);
            background-image: radial-gradient(circle at 50% 0%, rgba(56, 189, 248, 0.15) 0%, rgba(0,0,0,0.9) 100%);
            color: #eee; font-family: sans-serif; min-height: 100vh; overflow-x: hidden; padding-bottom: 50px;
        }

        /* --- ШАПКА --- */
        .meme-header { 
            display: flex; flex-direction: column; align-items: center; justify-content: center; 
            padding: 40px 15px 20px 15px; border-bottom: 2px dashed var(--neon-blue); 
            background: rgba(8, 8, 12, 0.85); backdrop-filter: blur(15px); -webkit-backdrop-filter: blur(15px);
            border-radius: 0 0 20px 20px; margin-bottom: 20px;
            box-shadow: 0 8px 25px -5px rgba(56, 189, 248, 0.4);
        }
        .splash-title {
            color: #fff; font-family: monospace; font-size: 32px; font-weight: 900; letter-spacing: 5px; 
            text-shadow: 0 0 10px var(--neon-blue), 0 0 20px var(--neon-blue); text-align: center;
        }
        .splash-sub { color: #94a3b8; font-size: 10px; letter-spacing: 2px; margin-top: 5px; text-align: center; text-transform: uppercase;}

        /* ПОИСК */
        .search-box { width: 100%; max-width: 400px; margin-top: 15px; }
        .search-input {
            width: 100%; padding: 10px 15px; border-radius: 12px; background: rgba(0,0,0,0.5); 
            border: 1px solid var(--neon-blue); color: #fff; font-weight: bold; outline: none; text-align: center;
            box-shadow: inset 0 2px 5px rgba(0,0,0,0.5);
        }

        /* ФИЛЬТРЫ */
        .sys-filter-container { display: flex; gap: 8px; overflow-x: auto; padding: 10px 15px; scrollbar-width: none; align-items: center; justify-content: center; flex-wrap: wrap; }
        .sys-filter-btn { 
            flex-shrink: 0; padding: 0 15px; height: 44px; border-radius: 12px; font-weight: 900; font-size: 11px; 
            cursor: pointer; color: #fff; border: 1px solid rgba(255,255,255,0.2); background: rgba(255,255,255,0.05); 
            text-transform: uppercase; transition: 0.2s; display: flex; align-items: center; justify-content: center;
        }
        .sys-filter-btn.active { filter: brightness(1.5); box-shadow: inset 0 0 10px currentColor, 0 0 15px currentColor !important; border-width: 2px; }

        /* СЕТКА */
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 15px; padding: 0 15px; max-width: 1200px; margin: 0 auto; }

        /* КАРТОЧКИ */
        .game-card { 
            position: relative; overflow: hidden; background-color: var(--glass-bg); backdrop-filter: blur(15px);
            border: 1px solid var(--glass-border); border-radius: 12px; display: flex; flex-direction: column; 
            align-items: center; justify-content: flex-end; transition: 0.2s; min-height: 180px; 
            background-size: cover; background-position: center;
        }
        .game-card::before { content: ''; position: absolute; inset: 0; background: linear-gradient(to top, rgba(0,0,0,0.95) 0%, rgba(0,0,0,0.2) 60%, rgba(0,0,0,0.4) 100%); z-index: 1; pointer-events: none;}

        .game-title { position: relative; z-index: 3; width: 100%; padding: 5px 8px; font-size: 11px; font-weight: bold; text-align: center; color: #fff; text-shadow: 1px 1px 2px #000; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

        /* СЕРДЕЧКО */
        .install-heart {
            position: absolute; top: 8px; left: 8px; z-index: 10;
            font-size: 18px; filter: drop-shadow(0 0 5px red); display: none;
        }
        .installed .install-heart { display: block; animation: heartbeat 1.5s infinite; }
        @keyframes heartbeat { 0% { transform: scale(1); } 50% { transform: scale(1.2); } 100% { transform: scale(1); } }

        .sys-badge { position: absolute; top: 8px; right: 8px; padding: 4px 8px; border-radius: 6px; font-size: 10px; font-weight: 900; z-index: 10; }

        /* КНОПКИ */
        .action-row { position: relative; z-index: 3; width: 100%; padding: 0 8px 10px 8px; display: flex; gap: 5px; }
        .action-btn { flex: 1; padding: 8px 0; border: 1px solid; border-radius: 6px; background: rgba(0,0,0,0.6); color: #fff; font-size: 9px; font-weight: 900; cursor: pointer; text-align: center; transition: 0.2s;}
        .action-btn:active { transform: scale(0.9); }
        .btn-view { border-color: var(--neon-blue); text-shadow: 0 0 5px var(--neon-blue); color: var(--neon-blue); }
        .btn-inst { border-color: var(--neon-green); text-shadow: 0 0 5px var(--neon-green); color: var(--neon-green); }
        .btn-inst:disabled { border-color: #444; color: #666; text-shadow: none; cursor: default; }

        /* КОНСОЛЬ */
        #hub-console {
            position: fixed; bottom: -300px; left: 0; width: 100%; height: 250px;
            background: rgba(10, 10, 15, 0.95); backdrop-filter: blur(20px);
            border-top: 2px solid var(--neon-blue); z-index: 1000; transition: 0.4s;
            display: flex; flex-direction: column; font-family: monospace;
        }
        #hub-console.open { bottom: 0; }
        .console-body { flex: 1; overflow-y: auto; padding: 10px; font-size: 10px; line-height: 1.4; color: #aaa; }
        .log-success { color: var(--neon-green); }
        .log-error { color: var(--neon-red); }
        .log-info { color: var(--neon-blue); }
        .console-trigger { position: fixed; top: 10px; right: 10px; z-index: 1001; opacity: 0.5; cursor: pointer; font-size: 20px; }

        /* ЦВЕТА СИСТЕМ */
        .sys-nes { box-shadow: 0 0 15px rgba(239,68,68,0.3); border-color: #ef4444; }
        .badge-nes { background: #ef4444; color: white; }
        .sys-smd { box-shadow: 0 0 15px rgba(59,130,246,0.3); border-color: #3b82f6; }
        .badge-smd { background: #3b82f6; color: white; }
        .sys-gba { box-shadow: 0 0 15px rgba(217,70,239,0.3); border-color: #d946ef; }
        .badge-gba { background: #d946ef; color: white; }
        .sys-snes { box-shadow: 0 0 15px rgba(168,85,247,0.3); border-color: #a855f7; }
        .badge-snes { background: #a855f7; color: white; }
        .sys-unk { box-shadow: 0 0 15px rgba(255,255,255,0.1); border-color: #fff; }
        .badge-unk { background: #666; color: white; }

        .no-cover-icon { position: absolute; top: 40%; left: 50%; transform: translate(-50%, -50%); font-size: 40px; z-index: 2; opacity: 0.5; }
    </style>
</head>
<body>

    <div class="console-trigger" onclick="toggleConsole()">⌨️</div>
    <div id="hub-console">
        <div style="padding: 5px 15px; background: #111; font-size: 10px; color: var(--neon-blue); display: flex; justify-content: space-between; border-bottom: 1px solid #333;">
            <span>ARCADE DEBUGGER</span>
            <span onclick="toggleConsole()" style="cursor:pointer">✖</span>
        </div>
        <div id="console-body" class="console-body"></div>
    </div>

    <div class="meme-header">
        <a href="index.html" class="back-link">◀ НАЗАД В ЭМУЛЯТОР</a>
        <div class="splash-title">ARCADE STORE</div>
        <div class="splash-sub">SECURE CLOUD WAREHOUSE</div>
        <div class="search-box">
            <input type="text" id="searchInput" class="search-input" placeholder="Поиск игры..." oninput="triggerSearch()">
        </div>
    </div>

    <div class="sys-filter-container" id="filter-bar">
        <button class="sys-filter-btn active" style="border-color:#fff; color:#fff;" onclick="filterGames('all', this)">ВCЕ ИГРЫ</button>
    </div>

    <div class="grid" id="game-grid"></div>

    <script>
        function hubLog(msg, type = 'info') {
            const body = document.getElementById('console-body');
            const entry = document.createElement('div');
            entry.className = type === 'success' ? 'log-success' : (type === 'error' ? 'log-error' : (type === 'info' ? 'log-info' : ''));
            entry.innerHTML = `[${new Date().toLocaleTimeString()}] ${msg}`;
            body.appendChild(entry);
            body.scrollTop = body.scrollHeight;
        }

        function toggleConsole() { document.getElementById('hub-console').classList.toggle('open'); }

        const WAREHOUSE_URL = 'https://crottorc91-oss.github.io/Baza/';
        const RAW_URL = 'https://raw.githubusercontent.com/crottorc91-oss/Baza/main/';
        
        let allGames = [];
        let installedNames = [];
        let db;

        const sysInfo = {
            'nes': { css: 'sys-nes', badge: 'badge-nes', name: 'DENDY', hex: '#ef4444' },
            'smd': { css: 'sys-smd', badge: 'badge-smd', name: 'SEGA', hex: '#3b82f6' },
            'gba': { css: 'sys-gba', badge: 'badge-gba', name: 'GBA', hex: '#d946ef' },
            'snes': { css: 'sys-snes', badge: 'badge-snes', name: 'SNES', hex: '#a855f7' }
        };

        // --- ГЛУБОКАЯ ИНИЦИАЛИЗАЦИЯ ЕДИНОЙ БАЗЫ ArcadeDB ---
        const request = indexedDB.open("ArcadeDB", 1);

        request.onupgradeneeded = (e) => {
            db = e.target.result;
            hubLog("DB: Требуется обновление/создание таблиц...", "info");
            if (!db.objectStoreNames.contains("games")) {
                db.createObjectStore("games", { keyPath: "id", autoIncrement: true });
                hubLog("DB: Таблица 'games' успешно создана.", "success");
            }
        };

        request.onsuccess = async (e) => { 
            db = e.target.result; 
            hubLog("DB: Подключение к ArcadeDB успешно.", "success");
            
            // Если таблица существует, проверяем установленные игры
            if (db.objectStoreNames.contains("games")) {
                installedNames = await getInstalledList();
            } else {
                hubLog("DB: Таблица 'games' не найдена. Она будет создана при первой установке.", "error");
            }
            loadCatalog(); 
        };

        request.onerror = (e) => hubLog("DB: Ошибка подключения! " + e.target.errorCode, "error");

        function getInstalledList() {
            return new Promise((resolve) => {
                try {
                    const tx = db.transaction("games", "readonly");
                    const store = tx.objectStore("games");
                    const req = store.getAll();
                    req.onsuccess = () => {
                        const names = req.result.map(g => g.n);
                        hubLog(`Sync: В базе найдено игр: ${names.length}`, "success");
                        resolve(names);
                    };
                    req.onerror = () => {
                        hubLog("Sync: Не удалось прочитать таблицу 'games'.", "error");
                        resolve([]);
                    };
                } catch(e) {
                    hubLog("Sync: База пуста или не инициализирована.", "info");
                    resolve([]);
                }
            });
        }

        async function loadCatalog() {
            hubLog("Catalog: Загрузка master_registry.json...");
            try {
                const response = await fetch(WAREHOUSE_URL + 'master_registry.json');
                if (!response.ok) throw new Error("HTTP " + response.status);
                allGames = await response.json();
                hubLog(`Catalog: Загружено игр: ${allGames.length}`, "success");
                buildFilters();
                renderGames(allGames);
            } catch (e) {
                hubLog("Catalog Error: Ошибка связи со складом: " + e.message, "error");
            }
        }

        function buildFilters() {
            const systems = [...new Set(allGames.map(g => g.sys))];
            const filterBar = document.getElementById('filter-bar');
            systems.forEach(sys => {
                const info = sysInfo[sys] || { name: sys.toUpperCase(), hex: '#fff' };
                const btn = document.createElement('button');
                btn.className = 'sys-filter-btn';
                btn.style.borderColor = info.hex;
                btn.style.color = info.hex;
                btn.textContent = info.name;
                btn.onclick = (e) => filterGames(sys, e.target);
                filterBar.appendChild(btn);
            });
        }

        function filterGames(sys, btn) {
            document.querySelectorAll('.sys-filter-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            hubLog(`UI: Фильтр сменен на ${sys.toUpperCase()}`);
            renderGames(sys === 'all' ? allGames : allGames.filter(g => g.sys === sys));
        }

        function triggerSearch() {
            const q = document.getElementById('searchInput').value.toLowerCase();
            renderGames(allGames.filter(g => g.title.toLowerCase().includes(q)));
        }

        function renderGames(list) {
            const grid = document.getElementById('game-grid');
            grid.innerHTML = '';
            list.forEach(game => {
                const info = sysInfo[game.sys] || { css: 'sys-unk', badge: 'badge-unk', name: game.sys };
                const isInstalled = installedNames.includes(game.title);
                
                let coverUrl = WAREHOUSE_URL + game.url.replace('.zip', '.png');

                const card = document.createElement('div');
                card.className = `game-card ${info.css} ${isInstalled ? 'installed' : ''}`;
                card.style.backgroundImage = `url('${coverUrl}')`;
                
                card.innerHTML = `
                    <div class="install-heart">❤️</div>
                    <div class="no-cover-icon">🎮</div>
                    <div class="sys-badge ${info.badge}">${info.name}</div>
                    <div class="game-title" title="${game.title}">${game.title}</div>
                    <div class="action-row">
                        <button class="action-btn btn-view" onclick="runPreview('${game.sys}', '${game.url}')">ОБЗОР</button>
                        <button class="action-btn btn-inst" onclick="installSilent(this, '${game.sys}', '${game.url}', '${game.title.replace(/'/g, "\\'")}')" ${isInstalled ? 'disabled' : ''}>
                            ${isInstalled ? 'В БАЗЕ' : 'СКАЧАТЬ'}
                        </button>
                    </div>
                `;
                
                const img = new Image();
                img.onload = () => { if(card.querySelector('.no-cover-icon')) card.querySelector('.no-cover-icon').style.display = 'none'; };
                img.src = coverUrl;

                grid.appendChild(card);
            });
        }

        // --- ТИХАЯ УСТАНОВКА (ОСТАЕМСЯ В ХАБЕ) ---
        async function installSilent(btn, sys, url, title) {
            hubLog(`Installer: Начинаю скачивание "${title}"...`);
            const originalText = btn.textContent;
            btn.disabled = true;
            btn.textContent = "...";
            
            try {
                const res = await fetch(RAW_URL + url);
                if(!res.ok) throw new Error("404 Файл не найден");
                const blob = await res.blob();
                hubLog(`Installer: Скачано ${(blob.size/1024/1024).toFixed(2)} MB. Записываю в БД...`, "info");
                
                // Проверяем наличие таблицы прямо перед записью
                if (!db.objectStoreNames.contains("games")) {
                    throw new Error("Таблица 'games' отсутствует в ArcadeDB!");
                }

                const tx = db.transaction("games", "readwrite");
                const store = tx.objectStore("games");
                
                // Добавляем игру (n - имя, s - система, d - данные)
                const gameData = { n: title, s: sys, d: blob, i: null, t: Date.now() };
                const req = store.put(gameData);

                req.onsuccess = () => {
                    hubLog(`Installer: "${title}" успешно осела в оффлайн.`, "success");
                    btn.textContent = "ГОТОВО";
                    btn.closest('.game-card').classList.add('installed');
                    installedNames.push(title);
                };
                
                req.onerror = (e) => { throw new Error("Ошибка транзакции: " + e.target.error); };

            } catch (e) {
                hubLog(`Installer Error: ${e.message}`, "error");
                btn.disabled = false;
                btn.textContent = "ОШИБКА";
                setTimeout(() => { btn.textContent = originalText; }, 2000);
            }
        }

        function runPreview(sys, url) {
            hubLog(`System: Запуск песочницы для ${url}...`);
            window.location.href = `index.html?sys=${sys}&rom=${encodeURIComponent(RAW_URL + url)}&preview=true`;
        }
    </script>
</body>
</html>
