<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Arcade Hub</title>
    <style>
        :root {
            --bg-color: #060608;
            --glass: rgba(15, 15, 25, 0.8);
            --neon-blue: #38bdf8;
            --neon-red: #ef4444;
            --neon-green: #10b981;
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; margin: 0; padding: 0; }
        
        body {
            background: var(--bg-color);
            background-image: radial-gradient(circle at 50% 0%, rgba(56, 189, 248, 0.15) 0%, transparent 100%);
            color: #eee;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            min-height: 100vh;
            padding-bottom: 100px;
        }

        /* Шапка */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px;
            background: rgba(8, 8, 12, 0.9);
            border-bottom: 2px dashed var(--neon-blue);
            position: sticky;
            top: 0;
            z-index: 100;
            backdrop-filter: blur(10px);
        }

        .menu-btn, .db-status {
            background: rgba(255,255,255,0.1);
            border: 1px solid rgba(255,255,255,0.2);
            color: #fff;
            padding: 8px 12px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
        }

        .db-status.online { background: rgba(16, 185, 129, 0.2); border-color: var(--neon-green); color: var(--neon-green); }
        .db-status.offline { background: rgba(239, 68, 68, 0.2); border-color: var(--neon-red); color: var(--neon-red); }

        .title {
            font-family: monospace;
            font-size: 24px;
            font-weight: 900;
            letter-spacing: 3px;
            text-shadow: 0 0 10px var(--neon-blue);
        }

        /* Поиск */
        .search-box {
            padding: 15px 20px;
            position: relative;
        }

        .search-input {
            width: 100%;
            padding: 12px 20px 12px 40px;
            border-radius: 25px;
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.1);
            color: #fff;
            font-size: 14px;
            outline: none;
        }

        .search-input:focus { border-color: var(--neon-blue); box-shadow: 0 0 15px rgba(56,189,248,0.3); }

        /* Фильтры */
        .filters {
            display: flex;
            gap: 8px;
            overflow-x: auto;
            padding: 10px 20px;
            scrollbar-width: none;
        }

        .filters::-webkit-scrollbar { display: none; }

        .filter-btn {
            flex-shrink: 0;
            padding: 8px 16px;
            border-radius: 20px;
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.2);
            color: #fff;
            cursor: pointer;
            font-weight: 600;
            font-size: 12px;
            text-transform: uppercase;
            transition: 0.2s;
        }

        .filter-btn.active {
            background: rgba(56, 189, 248, 0.2);
            border-color: var(--neon-blue);
            box-shadow: 0 0 10px rgba(56,189,248,0.3);
        }

        /* Сетка */
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
            gap: 15px;
            padding: 20px;
        }

        /* Карточка */
        .game-card {
            position: relative;
            aspect-ratio: 3/4;
            background: var(--glass);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 12px;
            overflow: hidden;
            cursor: pointer;
            transition: transform 0.2s;
            background-size: cover;
            background-position: center;
        }

        .game-card:active { transform: scale(0.95); }

        .game-card::before {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(to top, rgba(0,0,0,0.95) 0%, rgba(0,0,0,0.3) 50%, transparent 100%);
        }

        /* Сердечко */
        .heart-btn {
            position: absolute;
            top: 8px;
            left: 8px;
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background: rgba(0,0,0,0.6);
            border: 1px solid rgba(255,255,255,0.3);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            z-index: 10;
            cursor: pointer;
            transition: all 0.3s;
        }

        /* НЕОНОВОЕ СЕРДЕЧКО когда установлено */
        .heart-btn.installed {
            background: rgba(239, 68, 68, 0.3);
            border-color: var(--neon-red);
            box-shadow: 0 0 10px var(--neon-red), 0 0 20px rgba(239,68,68,0.5);
            animation: heartbeat 2s infinite;
        }

        @keyframes heartbeat {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.15); }
        }

        .heart-btn.downloading {
            background: rgba(245, 158, 11, 0.5);
            border-color: #f59e0b;
            animation: spin 1s linear infinite;
        }

        @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }

        /* Значок системы */
        .sys-badge {
            position: absolute;
            top: 8px;
            right: 8px;
            padding: 4px 8px;
            border-radius: 6px;
            font-size: 10px;
            font-weight: 900;
            z-index: 10;
            text-transform: uppercase;
        }

        /* Цвета систем */
        .badge-nes { background: #ef4444; }
        .badge-smd { background: #3b82f6; }
        .badge-snes { background: #a855f7; }
        .badge-gba { background: #d946ef; }
        .badge-dos { background: #10b981; }
        .badge-ngp { background: #06b6d4; }
        .badge-html { background: #f59e0b; }

        .game-title {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            padding: 10px;
            font-size: 12px;
            font-weight: bold;
            text-align: center;
            z-index: 5;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* Пустое состояние */
        .empty {
            grid-column: 1/-1;
            text-align: center;
            padding: 60px 20px;
            color: #64748b;
        }

        /* Лог панель */
        #log-panel {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            height: 150px;
            background: rgba(0,0,0,0.95);
            border-top: 2px solid var(--neon-blue);
            font-family: monospace;
            font-size: 11px;
            overflow-y: auto;
            padding: 10px;
            display: none;
            z-index: 1000;
        }

        #log-panel.active { display: block; }

        .log-entry { padding: 2px 0; border-left: 2px solid var(--neon-blue); padding-left: 8px; margin-bottom: 2px; }
        .log-error { border-left-color: var(--neon-red); color: #fca5a5; }
        .log-success { border-left-color: var(--neon-green); color: #34d399; }
    </style>
</head>
<body>

    <div class="header">
        <button class="menu-btn" onclick="toggleMenu()">☰</button>
        <div class="title">ARCADE HUB</div>
        <div class="db-status online" id="db-status">ONLINE</div>
    </div>

    <div class="search-box">
        <input type="text" class="search-input" id="search" placeholder="Поиск игры..." oninput="filterGames()">
    </div>

    <div class="filters" id="filters">
        <button class="filter-btn active" onclick="setFilter('all', this)">Все</button>
    </div>

    <div class="grid" id="grid"></div>

    <!-- Панель логов (скрыта если DEBUG=false) -->
    <div id="log-panel"></div>

    <script>
        // ==========================================
        // КОНФИГУРАЦИЯ (ПОМЕНЯЙТЕ ЗДЕСЬ)
        // ==========================================
        const CONFIG = {
            DEBUG_MODE: true,                    // true = показывать логи, false = скрыть
            WAREHOUSE_URL: 'https://crottorc91-oss.github.io/Baza/',
            EMULATOR_DB_NAME: 'ArcadeDB',        // Имя БД из твоего index.html
            EMULATOR_STORE: 'games'              // Название хранилища
        };

        // ==========================================
        // ЛОГГЕР
        // ==========================================
        const Logger = {
            log: (msg, type = 'info') => {
                if (!CONFIG.DEBUG_MODE) return;
                console.log(`[${type.toUpperCase()}] ${msg}`);
                
                const panel = document.getElementById('log-panel');
                if (panel) {
                    panel.classList.add('active');
                    const div = document.createElement('div');
                    div.className = `log-entry log-${type}`;
                    div.textContent = `[${new Date().toLocaleTimeString()}] ${msg}`;
                    panel.appendChild(div);
                    panel.scrollTop = panel.scrollHeight;
                }
            }
        };

        // ==========================================
        // ДАННЫЕ
        // ==========================================
        let allGames = [];
        let installedGames = new Set(); // ID установленных игр
        let currentFilter = 'all';
        let searchQuery = '';

        // ==========================================
        // СИНХРОНИЗАЦИЯ С ЭМУЛЯТОРОМ (Сердечки)
        // ==========================================
        async function syncWithEmulator() {
            Logger.log('Синхронизация с БД эмулятора...', 'info');
            
            return new Promise((resolve) => {
                try {
                    const request = indexedDB.open(CONFIG.EMULATOR_DB_NAME);
                    
                    request.onerror = () => {
                        Logger.log('Нет доступа к БД эмулятора', 'error');
                        resolve();
                    };
                    
                    request.onsuccess = (event) => {
                        const db = event.target.result;
                        Logger.log(`БД эмулятора открыта, версия ${db.version}`, 'success');
                        
                        if (!db.objectStoreNames.contains(CONFIG.EMULATOR_STORE)) {
                            Logger.log('Хранилище games не найдено', 'error');
                            resolve();
                            return;
                        }
                        
                        const transaction = db.transaction([CONFIG.EMULATOR_STORE], 'readonly');
                        const store = transaction.objectStore(CONFIG.EMULATOR_STORE);
                        const getAll = store.getAll();
                        
                        getAll.onsuccess = () => {
                            const games = getAll.result;
                            installedGames.clear();
                            
                            games.forEach(game => {
                                // Сохраняем по имени файла
                                if (game.fileName) installedGames.add(game.fileName);
                                if (game.title) installedGames.add(game.title);
                            });
                            
                            Logger.log(`Найдено установленных игр: ${installedGames.size}`, 'success');
                            updateHeartIcons();
                            resolve();
                        };
                    };
                    
                    request.onupgradeneeded = () => {
                        Logger.log('БД эмулятора требует обновления', 'warn');
                    };
                    
                } catch (e) {
                    Logger.log(`Ошибка синхронизации: ${e.message}`, 'error');
                    resolve();
                }
            });
        }

        function updateHeartIcons() {
            document.querySelectorAll('.game-card').forEach(card => {
                const url = card.dataset.url;
                if (!url) return;
                
                const fileName = url.split('/').pop();
                const isInstalled = installedGames.has(fileName);
                
                const heart = card.querySelector('.heart-btn');
                if (isInstalled && heart) {
                    heart.classList.add('installed');
                    heart.innerHTML = '❤️';
                    card.dataset.installed = 'true';
                }
            });
        }

        // ==========================================
        // ЗАГРУЗКА КАТАЛОГА
        // ==========================================
        async function loadCatalog() {
            try {
                Logger.log('Загрузка каталога...', 'info');
                const response = await fetch(CONFIG.WAREHOUSE_URL + 'master_registry.json');
                allGames = await response.json();
                Logger.log(`Загружено игр: ${allGames.length}`, 'success');
                
                createFilters();
                renderGames();
                await syncWithEmulator(); // Проверяем какие уже установлены
                
            } catch (e) {
                Logger.log(`Ошибка загрузки: ${e.message}`, 'error');
                document.getElementById('grid').innerHTML = '<div class="empty">Ошибка загрузки каталога</div>';
            }
        }

        // ==========================================
        // ФИЛЬТРЫ
        // ==========================================
        function createFilters() {
            const systems = [...new Set(allGames.map(g => g.sys))];
            const container = document.getElementById('filters');
            
            systems.forEach(sys => {
                const btn = document.createElement('button');
                btn.className = 'filter-btn';
                btn.textContent = sys.toUpperCase();
                btn.onclick = () => setFilter(sys, btn);
                container.appendChild(btn);
            });
        }

        function setFilter(sys, btn) {
            document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            currentFilter = sys;
            renderGames();
        }

        function filterGames() {
            searchQuery = document.getElementById('search').value.toLowerCase();
            renderGames();
        }

        // ==========================================
        // РЕНДЕР
        // ==========================================
        function renderGames() {
            const grid = document.getElementById('grid');
            grid.innerHTML = '';
            
            let filtered = allGames;
            
            if (currentFilter !== 'all') {
                filtered = filtered.filter(g => g.sys === currentFilter);
            }
            
            if (searchQuery) {
                filtered = filtered.filter(g => g.title.toLowerCase().includes(searchQuery));
            }
            
            if (filtered.length === 0) {
                grid.innerHTML = '<div class="empty">Ничего не найдено</div>';
                return;
            }
            
            filtered.forEach(game => {
                const card = document.createElement('div');
                card.className = 'game-card';
                card.dataset.url = game.url;
                card.dataset.sys = game.sys;
                
                // Обложка
                const coverUrl = CONFIG.WAREHOUSE_URL + game.url.replace(/\.[^/.]+$/, '.png');
                card.style.backgroundImage = `url('${coverUrl}')`;
                
                // Проверяем установлена ли
                const fileName = game.url.split('/').pop();
                const isInstalled = installedGames.has(fileName);
                
                // Цвет системы
                const sysColors = {
                    nes: 'badge-nes', smd: 'badge-smd', snes: 'badge-snes',
                    gba: 'badge-gba', dos: 'badge-dos', ngp: 'badge-ngp', html: 'badge-html'
                };
                
                card.innerHTML = `
                    <div class="heart-btn ${isInstalled ? 'installed' : ''}" onclick="handleHeart(event, '${game.url}', '${game.sys}')">
                        ${isInstalled ? '❤️' : '🤍'}
                    </div>
                    <div class="sys-badge ${sysColors[game.sys] || 'badge-nes'}">${game.sys.toUpperCase()}</div>
                    <div class="game-title">${game.title}</div>
                `;
                
                // Клик по карточке = играть
                card.onclick = (e) => {
                    if (e.target.classList.contains('heart-btn')) return;
                    launchGame(game, isInstalled);
                };
                
                grid.appendChild(card);
            });
        }

        // ==========================================
        // ОБРАБОТКА СЕРДЕЧКА (Установка)
        // ==========================================
        async function handleHeart(event, url, sys) {
            event.stopPropagation();
            
            const card = event.target.closest('.game-card');
            const heart = event.target;
            
            if (heart.classList.contains('installed')) {
                // Уже установлено — предлагаем удалить или играть
                if (confirm('Игра уже установлена. Удалить?')) {
                    await deleteGame(url);
                    heart.classList.remove('installed');
                    heart.innerHTML = '🤍';
                }
                return;
            }
            
            // Начинаем скачивание через эмулятор
            heart.classList.add('downloading');
            heart.innerHTML = '⏳';
            
            const fullUrl = CONFIG.WAREHOUSE_URL + url;
            
            // Открываем эмулятор с флагом preview (чтобы не стартовал автоматом)
            const emuWindow = window.open(
                `index.html?sys=${sys}&rom=${encodeURIComponent(fullUrl)}&preview=true`, 
                '_blank'
            );
            
            // Ждем загрузки (проверяем каждую секунду)
            let checks = 0;
            const checkInterval = setInterval(async () => {
                checks++;
                await syncWithEmulator();
                
                const fileName = url.split('/').pop();
                if (installedGames.has(fileName)) {
                    clearInterval(checkInterval);
                    heart.classList.remove('downloading');
                    heart.classList.add('installed');
                    heart.innerHTML = '❤️';
                    Logger.log(`Установлено: ${fileName}`, 'success');
                }
                
                if (checks > 30) { // 30 секунд таймаут
                    clearInterval(checkInterval);
                    heart.classList.remove('downloading');
                    heart.innerHTML = '🤍';
                    Logger.log('Таймаут установки', 'error');
                }
            }, 1000);
        }

        // ==========================================
        // ЗАПУСК ИГРЫ
        // ==========================================
        function launchGame(game, isInstalled) {
            const fullUrl = CONFIG.WAREHOUSE_URL + game.url;
            
            if (isInstalled) {
                // Ищем ID в БД эмулятора для запуска
                const request = indexedDB.open(CONFIG.EMULATOR_DB_NAME);
                request.onsuccess = (event) => {
                    const db = event.target.result;
                    const tx = db.transaction([CONFIG.EMULATOR_STORE], 'readonly');
                    const store = tx.objectStore(CONFIG.EMULATOR_STORE);
                    const getAll = store.getAll();
                    
                    getAll.onsuccess = () => {
                        const fileName = game.url.split('/').pop();
                        const found = getAll.result.find(g => g.fileName === fileName);
                        
                        if (found) {
                            // Запускаем по ID (оффлайн режим)
                            window.location.href = `index.html?sys=${game.sys}&gameId=${found.id}`;
                        } else {
                            // Fallback на онлайн
                            window.location.href = `index.html?sys=${game.sys}&rom=${encodeURIComponent(fullUrl)}`;
                        }
                    };
                };
            } else {
                // Онлайн режим
                window.location.href = `index.html?sys=${game.sys}&rom=${encodeURIComponent(fullUrl)}`;
            }
        }

        async function deleteGame(url) {
            // Здесь можно добавить удаление из БД эмулятора если нужно
            Logger.log(`Удаление: ${url}`, 'info');
            installedGames.delete(url.split('/').pop());
        }

        // ==========================================
        // МЕНЮ
        // ==========================================
        function toggleMenu() {
            alert('Меню: Всего игр: ' + allGames.length + '\nУстановлено: ' + installedGames.size);
        }

        // ==========================================
        // СТАРТ
        // ==========================================
        window.addEventListener('DOMContentLoaded', loadCatalog);
    </script>

</body>
</html>
